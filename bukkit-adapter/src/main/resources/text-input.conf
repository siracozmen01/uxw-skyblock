# Text input: how a menu asks a player to write something.
#
# A menu asks for a word in six places: a warp's name, an island to visit, the island's name, a
# home's name, a player to invite, and an amount for the island bank. Each one captures the line in
# one of four ways:
#
#   anvil  : a small anvil opens. The player writes in the rename field and takes the result.
#   chat   : the menu closes and the player's next chat message is the answer.
#   sign   : a sign opens for editing, and the line written on it is the answer.
#   dialog : a native dialog screen opens. A server too old for one uses a sign, then an anvil, and
#            says so once in the console.
#
# Pick one for every place below, or one for all of them with default-mode. Every place works in
# every way, so changing one is always safe. A Bedrock player always gets a native form instead,
# whichever way a place is set to, because an anvil or a sign does not work properly there.

# The way a place not listed under modes asks. anvil, chat, sign or dialog.
default-mode = anvil

# Writing one of these instead of an answer cancels the question and opens the menu again. The first
# one is the word the chat hint tells the player to write.
cancel-keywords = ["cancel", "iptal"]

# One line for each place a menu asks. Delete a line and that place follows default-mode.
modes {
  "warp.name" = anvil        # the name of a new warp, from the warps menu
  "island.visit" = anvil     # the player whose island to visit, from the warps menu
  "island.name" = anvil      # the island's new name, from the settings menu
  "home.name" = anvil        # the name of a new home, from the homes menu
  "member.name" = anvil      # the player to invite, from the members menu
  "bank.amount" = chat       # how much to put in or take out, from the bank menu
  "role.name" = anvil        # the name of a new role, from the roles menu
  "guestbook.message" = chat # what to write in a guestbook, from the guestbook menu
  "alliance.player" = anvil  # whose island to offer an alliance, from the alliances menu
}
