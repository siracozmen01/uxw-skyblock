# ==============================================================================
# UXPLIMA Skyblock - Island Private Chat Subsystem Configuration (CHT-001)
# ==============================================================================

chat {
    # Whether the island chat subsystem is enabled.
    enabled = true

    # Adventure MiniMessage format for team chat messages.
    # Placeholders: <role>, <player>, <message>, <island_name>
    format = "<dark_gray>[<aqua>Island Chat<dark_gray>] <gray>[<green><role><gray>] <yellow><player><white>: <message>"

    # Adventure MiniMessage format for staff spy notifications.
    # Placeholders: <role>, <player>, <message>, <island_name>
    spy-format = "<dark_gray>[<red>SPY<dark_gray>] <dark_gray>[<aqua><island_name><dark_gray>] <gray>[<green><role><gray>] <yellow><player><white>: <message>"

    # Maximum messages allowed per second per player before rate limiting kicks in (0 to disable).
    rate-limit-messages-per-second = 5
}
