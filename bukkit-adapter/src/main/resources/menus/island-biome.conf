# ==============================================================================
# UXPLIMA Skyblock - Island Biome Menu
#
# This file is the menu. Slots, materials, titles and lore are read from here,
# never decided in code. Move a slot, restart, and the slot has moved.
#
# A %argument_<name>% token is a live value the server fills when the menu opens.
# The set every island menu is given is listed in island-main.conf.
#
# A click runs the verbs named under click. Every plugin has close, open:<menu>,
# command:<line>, message:<line> and sound:<name> <volume> <pitch>. command runs
# the line as the viewer, so a server that renamed /is renames it here too.
# ==============================================================================

title = "@menu.biome.title"
rows = 4

fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  name = " "
}

items {
  plains {
    slot = 10
    material = "GRASS_BLOCK"
    name = "@menu.biome.plains_name"
    lore = [
      "@menu.biome.plains_lore1",
      "",
      "@menu.biome.plains_lore2",
    ]
    click {
      any = ["command:is biome plains"]
    }
  }

  desert {
    slot = 11
    material = "SAND"
    name = "@menu.biome.desert_name"
    lore = [
      "@menu.biome.desert_lore1",
      "",
      "@menu.biome.desert_lore2",
    ]
    click {
      any = ["command:is biome desert"]
    }
  }

  jungle {
    slot = 12
    material = "JUNGLE_LOG"
    name = "@menu.biome.jungle_name"
    lore = [
      "@menu.biome.jungle_lore1",
      "",
      "@menu.biome.jungle_lore2",
    ]
    click {
      any = ["command:is biome jungle"]
    }
  }

  swamp {
    slot = 13
    material = "LILY_PAD"
    name = "@menu.biome.swamp_name"
    lore = [
      "@menu.biome.swamp_lore1",
      "",
      "@menu.biome.swamp_lore2",
    ]
    click {
      any = ["command:is biome swamp"]
    }
  }

  snowy {
    slot = 14
    material = "SNOW_BLOCK"
    name = "@menu.biome.snowy_name"
    lore = [
      "@menu.biome.snowy_lore1",
      "",
      "@menu.biome.snowy_lore2",
    ]
    click {
      any = ["command:is biome snowy_plains"]
    }
  }

  flower {
    slot = 15
    material = "POPPY"
    name = "@menu.biome.flower_name"
    lore = [
      "@menu.biome.flower_lore1",
      "",
      "@menu.biome.flower_lore2",
    ]
    click {
      any = ["command:is biome flower_forest"]
    }
  }

  nether {
    slot = 16
    material = "NETHERRACK"
    name = "@menu.biome.nether_name"
    lore = [
      "@menu.biome.nether_lore1",
      "",
      "@menu.biome.nether_lore2",
    ]
    click {
      any = ["command:is biome nether_wastes"]
    }
  }

  back {
    slot = 30
    material = "ARROW"
    name = "@menu.biome.back_name"
    lore = [
      "@menu.biome.back_lore1",
    ]
    click {
      any = ["open:island-main"]
    }
  }

  close {
    slot = 32
    material = "BARRIER"
    name = "@menu.biome.close_name"
    lore = [
      "@menu.biome.close_lore1",
    ]
    click {
      any = ["close"]
    }
  }
}
