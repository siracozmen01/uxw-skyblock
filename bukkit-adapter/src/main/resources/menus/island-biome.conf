# ==============================================================================
# UXPLIMA Skyblock - Island Biome Menu
#
# This file is the menu. Slots, materials, titles and lore are read from here,
# never decided in code. Move a slot, restart, and the slot has moved.
#
# A %argument_<name>% token is a live value the server fills when the menu opens.
# The set every island menu is given is listed in island-main.conf.
#
# A click runs the verbs named under click. Every plugin has close, open:<menu>,
# command:<line>, message:<line> and sound:<name> <volume> <pitch>. command runs
# the line as the viewer, so a server that renamed /is renames it here too.
# ==============================================================================

title = "<gradient:#55FF55:#FFFF55><b>Island Biome</b></gradient>"
rows = 4

fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  name = " "
}

items {
  plains {
    slot = 10
    material = "GRASS_BLOCK"
    name = "<green><b>Plains</b></green>"
    lore = [
      "<gray>The one every island starts with.</gray>",
      "",
      "<yellow>Click to apply.</yellow>",
    ]
    click {
      any = ["command:is biome plains"]
    }
  }

  desert {
    slot = 11
    material = "SAND"
    name = "<yellow><b>Desert</b></yellow>"
    lore = [
      "<gray>No rain, and cactus grows faster.</gray>",
      "",
      "<yellow>Click to apply.</yellow>",
    ]
    click {
      any = ["command:is biome desert"]
    }
  }

  jungle {
    slot = 12
    material = "JUNGLE_LOG"
    name = "<dark_green><b>Jungle</b></dark_green>"
    lore = [
      "<gray>Warm and wet. Cocoa grows here.</gray>",
      "",
      "<yellow>Click to apply.</yellow>",
    ]
    click {
      any = ["command:is biome jungle"]
    }
  }

  swamp {
    slot = 13
    material = "LILY_PAD"
    name = "<dark_green><b>Swamp</b></dark_green>"
    lore = [
      "<gray>Slimes spawn at night.</gray>",
      "",
      "<yellow>Click to apply.</yellow>",
    ]
    click {
      any = ["command:is biome swamp"]
    }
  }

  snowy {
    slot = 14
    material = "SNOW_BLOCK"
    name = "<white><b>Snowy Plains</b></white>"
    lore = [
      "<gray>Water freezes and snow settles.</gray>",
      "",
      "<yellow>Click to apply.</yellow>",
    ]
    click {
      any = ["command:is biome snowy_plains"]
    }
  }

  flower {
    slot = 15
    material = "POPPY"
    name = "<light_purple><b>Flower Forest</b></light_purple>"
    lore = [
      "<gray>Bees and every flower.</gray>",
      "",
      "<yellow>Click to apply.</yellow>",
    ]
    click {
      any = ["command:is biome flower_forest"]
    }
  }

  nether {
    slot = 16
    material = "NETHERRACK"
    name = "<red><b>Nether Wastes</b></red>"
    lore = [
      "<gray>Water evaporates. Nether mobs spawn.</gray>",
      "",
      "<yellow>Click to apply.</yellow>",
    ]
    click {
      any = ["command:is biome nether_wastes"]
    }
  }

  back {
    slot = 30
    material = "ARROW"
    name = "<yellow><b>Back</b></yellow>"
    lore = [
      "<gray>Return to the island panel.</gray>",
    ]
    click {
      any = ["open:island-main"]
    }
  }

  close {
    slot = 32
    material = "BARRIER"
    name = "<red><b>Close</b></red>"
    lore = [
      "<gray>Close this menu.</gray>",
    ]
    click {
      any = ["close"]
    }
  }
}
