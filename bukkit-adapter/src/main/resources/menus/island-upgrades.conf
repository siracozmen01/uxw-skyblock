# ==============================================================================
# UXPLIMA Skyblock - Island Upgrades Menu
#
# This file is the menu. Move a slot here and the slot moves in game.
#
# A %argument_<name>% token is a live value the server fills when the menu opens.
# The ones this menu is given are the same set island-main.conf lists.
#
# A click runs the verbs named under click. skyblock:buy-upgrade takes the
# upgrade key as its argument, and the keys are the ones in modules/upgrades.conf:
# SIZE, MEMBERS, WARPS, CROP_GROWTH, SPAWNER_SPEED, ORE_GENERATOR, VAULT_PAGES.
# ==============================================================================

title = "@menu.upgrades.title"
rows = 4

fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  name = " "
}

items {
  size_upgrade {
    slot = 11
    material = "GRASS_BLOCK"
    name = "@menu.upgrades.size_upgrade_name"
    lore = [
      "<gray>Current tier: <white>%argument_size_tier%</white></gray>",
      "<gray>Radius now: <white>%argument_radius%</white> blocks</gray>",
      "",
      "@menu.upgrades.size_upgrade_lore3"
    ]
    click {
      any = ["skyblock:buy-upgrade SIZE"]
    }
  }

  member_upgrade {
    slot = 13
    material = "PLAYER_HEAD"
    name = "@menu.upgrades.member_upgrade_name"
    lore = [
      "<gray>Current tier: <white>%argument_members_tier%</white></gray>",
      "<gray>Members now: <white>%argument_member_count%</white></gray>",
      "",
      "@menu.upgrades.member_upgrade_lore3"
    ]
    click {
      any = ["skyblock:buy-upgrade MEMBERS"]
    }
  }

  generator_upgrade {
    slot = 15
    material = "FURNACE"
    name = "@menu.upgrades.generator_upgrade_name"
    lore = [
      "<gray>Current tier: <white>%argument_generator_tier%</white></gray>",
      "",
      "@menu.upgrades.generator_upgrade_lore2"
    ]
    click {
      any = ["skyblock:buy-upgrade ORE_GENERATOR"]
    }
  }

  back {
    slot = 31
    material = "ARROW"
    name = "@menu.upgrades.back_name"
    lore = [
      "@menu.upgrades.back_lore1"
    ]
    click {
      any = ["open:island-main"]
    }
  }
}
