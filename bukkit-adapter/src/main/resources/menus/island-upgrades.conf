# ==============================================================================
# UXPLIMA Skyblock - Island Upgrades Menu
#
# This file is the menu. Move a slot here and the slot moves in game.
#
# A %argument_<name>% token is a live value the server fills when the menu opens.
# The ones this menu is given are the same set island-main.conf lists.
#
# A click runs the verbs named under click. skyblock:buy-upgrade takes the
# upgrade key after a colon, as in skyblock:buy-upgrade:island_size, and a key
# is the name of a section in
# modules/upgrades.conf. Add a section there and a slot here and the upgrade is
# on sale, with no line of Java: island_size, member_limit, warp_slots,
# crop_growth, spawner_rates, ore_generator, vault_pages.
# ==============================================================================

title = "@menu.upgrades.title"
rows = 4

fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  name = " "
}

items {
  size_upgrade {
    slot = 11
    material = "GRASS_BLOCK"
    name = "@menu.upgrades.size_upgrade_name"
    lore = [
      "@menu.upgrades.size_tier_now",
      "@menu.upgrades.radius_now",
      "",
      "@menu.upgrades.size_upgrade_lore3"
    ]
    click {
      any = ["skyblock:buy-upgrade:island_size"]
    }
  }

  member_upgrade {
    slot = 13
    material = "PLAYER_HEAD"
    name = "@menu.upgrades.member_upgrade_name"
    lore = [
      "@menu.upgrades.members_tier_now",
      "@menu.upgrades.members_now",
      "",
      "@menu.upgrades.member_upgrade_lore3"
    ]
    click {
      any = ["skyblock:buy-upgrade:member_limit"]
    }
  }

  generator_upgrade {
    slot = 15
    material = "FURNACE"
    name = "@menu.upgrades.generator_upgrade_name"
    lore = [
      "@menu.upgrades.generator_tier_now",
      "",
      "@menu.upgrades.generator_upgrade_lore2"
    ]
    click {
      any = ["skyblock:buy-upgrade:ore_generator"]
    }
  }

  warp_upgrade {
    slot = 19
    material = "ENDER_PEARL"
    name = "@menu.upgrades.warp_upgrade_name"
    lore = [
      "@menu.upgrades.warps_tier_now",
      "",
      "@menu.upgrades.warp_upgrade_lore2"
    ]
    click {
      any = ["skyblock:buy-upgrade:warp_slots"]
    }
  }

  vault_upgrade {
    slot = 21
    material = "CHEST"
    name = "@menu.upgrades.vault_upgrade_name"
    lore = [
      "@menu.upgrades.vault_tier_now",
      "",
      "@menu.upgrades.vault_upgrade_lore2"
    ]
    click {
      any = ["skyblock:buy-upgrade:vault_pages"]
    }
  }

  crop_upgrade {
    slot = 23
    material = "WHEAT"
    name = "@menu.upgrades.crop_upgrade_name"
    lore = [
      "@menu.upgrades.crop_tier_now",
      "",
      "@menu.upgrades.crop_upgrade_lore2"
    ]
    click {
      any = ["skyblock:buy-upgrade:crop_growth"]
    }
  }

  spawner_upgrade {
    slot = 25
    material = "SPAWNER"
    name = "@menu.upgrades.spawner_upgrade_name"
    lore = [
      "@menu.upgrades.spawner_tier_now",
      "",
      "@menu.upgrades.spawner_upgrade_lore2"
    ]
    click {
      any = ["skyblock:buy-upgrade:spawner_rates"]
    }
  }

  back {
    slot = 31
    material = "ARROW"
    name = "@menu.upgrades.back_name"
    lore = [
      "@menu.upgrades.back_lore1"
    ]
    click {
      any = ["open:island-main"]
    }
  }
}
