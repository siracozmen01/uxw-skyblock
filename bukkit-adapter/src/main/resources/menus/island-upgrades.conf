# ==============================================================================
# UXPLIMA Skyblock - Island Upgrades Menu Configuration
# ==============================================================================

title = "<gradient:#FFAA00:#FF55FF><b>Island Upgrades</b></gradient>"
rows = 4

filler {
  material = "GRAY_STAINED_GLASS_PANE"
  name = " "
}

items {
  size_upgrade {
    slot = 11
    material = "GRASS_BLOCK"
    name = "<green><b>Island Size Upgrade</b></green>"
    lore = [
      "<gray>Current: <white>{current_size}x{current_size}</white></gray>",
      "<gray>Next: <yellow>{next_size}x{next_size}</yellow></gray>",
      "<gray>Cost: <gold>{cost}</gold></gray>",
      "",
      "<yellow>Click to upgrade!</yellow>"
    ]
  }

  member_upgrade {
    slot = 13
    material = "PLAYER_HEAD"
    name = "<aqua><b>Member Limit Upgrade</b></aqua>"
    lore = [
      "<gray>Current: <white>{current_members}</white></gray>",
      "<gray>Next: <yellow>{next_members}</yellow></gray>",
      "<gray>Cost: <gold>{cost}</gold></gray>",
      "",
      "<yellow>Click to upgrade!</yellow>"
    ]
  }

  generator_upgrade {
    slot = 15
    material = "FURNACE"
    name = "<gold><b>Ore Generator Upgrade</b></gold>"
    lore = [
      "<gray>Current Tier: <white>{current_tier}</white></gray>",
      "<gray>Next Tier: <yellow>{next_tier}</yellow></gray>",
      "<gray>Cost: <gold>{cost}</gold></gray>",
      "",
      "<yellow>Click to upgrade!</yellow>"
    ]
  }

  back {
    slot = 31
    material = "ARROW"
    name = "<yellow><b>Back</b></yellow>"
    lore = [
      "<gray>Return to main menu.</gray>"
    ]
  }
}
