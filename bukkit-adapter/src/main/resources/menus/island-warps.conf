# ==============================================================================
# UXPLIMA Skyblock - Island Warps Menu
#
# This file is the menu. Slots, materials, titles and lore are read from here,
# never decided in code. Move a slot, restart, and the slot has moved.
#
# A %argument_<name>% token is a live value the server fills when the menu opens.
# The set every island menu is given is listed in island-main.conf.
#
# A click runs the verbs named under click. Every plugin has close, open:<menu>,
# command:<line>, message:<line> and sound:<name> <volume> <pitch>. command runs
# the line as the viewer, so a server that renamed /is renames it here too.
# ==============================================================================

title = "@menu.warps.title"
rows = 5

fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  name = " "
}

items {
  list {
    slot = 13
    material = "COMPASS"
    name = "@menu.warps.list_name"
    lore = [
      "<gray>Warp slots unlocked: <white>%argument_warps_tier%</white></gray>",
      "",
      "@menu.warps.list_lore2",
    ]
    click {
      any = ["command:is warp list"]
    }
  }

  create {
    slot = 20
    material = "ENDER_EYE"
    name = "@menu.warps.create_name"
    lore = [
      "@menu.warps.create_lore1",
      "@menu.warps.create_lore2",
      "",
      "@menu.warps.create_lore3",
    ]
    click {
      any = [
        { do = "input:warp.name", prompt = "<yellow>Type a name for this warp.</yellow>" },
        "command:is warp create %input%"
      ]
    }
  }

  visit {
    slot = 22
    material = "ENDER_PEARL"
    name = "@menu.warps.visit_name"
    lore = [
      "@menu.warps.visit_lore1",
      "@menu.warps.visit_lore2",
      "",
      "@menu.warps.visit_lore3",
    ]
    click {
      any = [
        { do = "input:island.visit", prompt = "<yellow>Whose island do you want to visit?</yellow>" },
        "command:is visit %input%"
      ]
    }
  }

  browse {
    slot = 24
    material = "MAP"
    name = "@menu.warps.browse_name"
    lore = [
      "@menu.warps.browse_lore1",
      "",
      "@menu.warps.browse_lore2",
    ]
    click {
      any = ["command:is warp browse"]
    }
  }

  back {
    slot = 39
    material = "ARROW"
    name = "@menu.warps.back_name"
    lore = [
      "@menu.warps.back_lore1",
    ]
    click {
      any = ["open:island-main"]
    }
  }

  close {
    slot = 41
    material = "BARRIER"
    name = "@menu.warps.close_name"
    lore = [
      "@menu.warps.close_lore1",
    ]
    click {
      any = ["close"]
    }
  }
}
