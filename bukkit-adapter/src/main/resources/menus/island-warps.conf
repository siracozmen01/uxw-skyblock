# ==============================================================================
# UXPLIMA Skyblock - Island Warps Menu
#
# This file is the menu. Slots, materials, titles and lore are read from here,
# never decided in code. Move a slot, restart, and the slot has moved.
#
# A %argument_<name>% token is a live value the server fills when the menu opens.
# The set every island menu is given is listed in island-main.conf.
#
# A click runs the verbs named under click. Every plugin has close, open:<menu>,
# command:<line>, message:<line> and sound:<name> <volume> <pitch>. command runs
# the line as the viewer, so a server that renamed /is renames it here too.
# ==============================================================================

title = "<gradient:#55FFFF:#5555FF><b>Warps and Travel</b></gradient>"
rows = 5

fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  name = " "
}

items {
  list {
    slot = 13
    material = "COMPASS"
    name = "<aqua><b>Your Warps</b></aqua>"
    lore = [
      "<gray>Warp slots unlocked: <white>%argument_warps_tier%</white></gray>",
      "",
      "<yellow>Click to list them.</yellow>",
    ]
    click {
      any = ["command:is warp list"]
    }
  }

  create {
    slot = 20
    material = "ENDER_EYE"
    name = "<green><b>Set a Warp</b></green>"
    lore = [
      "<gray>Mark where you stand as a warp</gray>",
      "<gray>other players can travel to.</gray>",
      "",
      "<yellow>Click to be asked for a name.</yellow>",
    ]
    click {
      any = ["command:is warp create"]
    }
  }

  visit {
    slot = 22
    material = "ENDER_PEARL"
    name = "<light_purple><b>Visit an Island</b></light_purple>"
    lore = [
      "<gray>Travel to another player's island,</gray>",
      "<gray>if they let visitors in.</gray>",
      "",
      "<yellow>Click to be asked for a name.</yellow>",
    ]
    click {
      any = ["command:is visit"]
    }
  }

  browse {
    slot = 24
    material = "MAP"
    name = "<gold><b>Public Warps</b></gold>"
    lore = [
      "<gray>Every warp this server can reach.</gray>",
      "",
      "<yellow>Click to browse.</yellow>",
    ]
    click {
      any = ["command:is warp browse"]
    }
  }

  back {
    slot = 39
    material = "ARROW"
    name = "<yellow><b>Back</b></yellow>"
    lore = [
      "<gray>Return to the island panel.</gray>",
    ]
    click {
      any = ["open:island-main"]
    }
  }

  close {
    slot = 41
    material = "BARRIER"
    name = "<red><b>Close</b></red>"
    lore = [
      "<gray>Close this menu.</gray>",
    ]
    click {
      any = ["close"]
    }
  }
}
