# ==============================================================================
# UXPLIMA Skyblock - Island Settings Menu
#
# This file is the menu. Slots, materials, titles and lore are read from here,
# never decided in code. Move a slot, restart, and the slot has moved.
#
# A %argument_<name>% token is a live value the server fills when the menu opens.
# The set every island menu is given is listed in island-main.conf.
#
# A click runs the verbs named under click. Every plugin has close, open:<menu>,
# command:<line>, message:<line> and sound:<name> <volume> <pitch>. command runs
# the line as the viewer, so a server that renamed /is renames it here too.
# ==============================================================================

title = "<gradient:#FF5555:#FFAA00><b>Island Settings</b></gradient>"
rows = 5

fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  name = " "
}

items {
  pvp {
    slot = 11
    material = "IRON_SWORD"
    name = "<red><b>PvP</b></red>"
    lore = [
      "<gray>Whether members and visitors</gray>",
      "<gray>may fight on this island.</gray>",
      "",
      "<yellow>Click to toggle.</yellow>",
    ]
    click {
      any = ["command:is flag PVP"]
    }
  }

  visitors {
    slot = 13
    material = "OAK_DOOR"
    name = "<green><b>Visitors</b></green>"
    lore = [
      "<gray>Whether anyone who is not a member</gray>",
      "<gray>may set foot on the island.</gray>",
      "",
      "<yellow>Click to toggle.</yellow>",
    ]
    click {
      any = ["command:is flag VISITORS"]
    }
  }

  mobs {
    slot = 15
    material = "ZOMBIE_HEAD"
    name = "<dark_purple><b>Mob Spawning</b></dark_purple>"
    lore = [
      "<gray>Whether hostile mobs spawn here.</gray>",
      "",
      "<yellow>Click to toggle.</yellow>",
    ]
    click {
      any = ["command:is flag MOB_SPAWNING"]
    }
  }

  rename {
    slot = 20
    material = "NAME_TAG"
    name = "<aqua><b>Rename Island</b></aqua>"
    lore = [
      "<gray>Give the island a name that shows</gray>",
      "<gray>on the leaderboards.</gray>",
      "",
      "<yellow>Click to be asked for a name.</yellow>",
    ]
    click {
      any = ["command:is rename"]
    }
  }

  biome {
    slot = 22
    material = "GRASS_BLOCK"
    name = "<green><b>Biome</b></green>"
    lore = [
      "<gray>Change the weather, the grass colour</gray>",
      "<gray>and what grows here.</gray>",
      "",
      "<yellow>Click to choose.</yellow>",
    ]
    click {
      any = ["open:island-biome"]
    }
  }

  border {
    slot = 24
    material = "BARRIER"
    name = "<blue><b>Border</b></blue>"
    lore = [
      "<gray>Show or hide the wall that marks</gray>",
      "<gray>where your island ends.</gray>",
      "",
      "<yellow>Click to toggle.</yellow>",
    ]
    click {
      any = ["command:is border"]
    }
  }

  reset {
    slot = 31
    material = "TNT"
    name = "<dark_red><b>Reset Island</b></dark_red>"
    lore = [
      "<gray>Erase this island and start again.</gray>",
      "<red>You will be asked to confirm with a code.</red>",
      "",
      "<yellow>Click if you mean it.</yellow>",
    ]
    click {
      any = ["command:is reset"]
    }
  }

  back {
    slot = 39
    material = "ARROW"
    name = "<yellow><b>Back</b></yellow>"
    lore = [
      "<gray>Return to the island panel.</gray>",
    ]
    click {
      any = ["open:island-main"]
    }
  }

  close {
    slot = 41
    material = "BARRIER"
    name = "<red><b>Close</b></red>"
    lore = [
      "<gray>Close this menu.</gray>",
    ]
    click {
      any = ["close"]
    }
  }
}
