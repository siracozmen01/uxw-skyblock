# ==============================================================================
# UXPLIMA Skyblock - Island Settings Menu
#
# This file is the menu. Slots, materials, titles and lore are read from here,
# never decided in code. Move a slot, restart, and the slot has moved.
#
# A %argument_<name>% token is a live value the server fills when the menu opens.
# The set every island menu is given is listed in island-main.conf.
#
# A click runs the verbs named under click. Every plugin has close, open:<menu>,
# command:<line>, message:<line> and sound:<name> <volume> <pitch>. command runs
# the line as the viewer, so a server that renamed /is renames it here too.
# ==============================================================================

title = "@menu.settings.title"
rows = 5

fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  name = " "
}

items {
  pvp {
    slot = 11
    material = "IRON_SWORD"
    name = "@menu.settings.pvp_name"
    lore = [
      "@menu.settings.pvp_lore1",
      "@menu.settings.pvp_lore2",
      "",
      "@menu.settings.pvp_lore3",
    ]
    click {
      any = ["skyblock:island:flag pvp"]
    }
  }

  visitors {
    slot = 13
    material = "OAK_DOOR"
    name = "@menu.settings.visitors_name"
    lore = [
      "@menu.settings.visitors_lore1",
      "@menu.settings.visitors_lore2",
      "",
      "@menu.settings.visitors_lore3",
    ]
    click {
      any = ["skyblock:island:flag locked"]
    }
  }

  mobs {
    slot = 15
    material = "ZOMBIE_HEAD"
    name = "@menu.settings.mobs_name"
    lore = [
      "@menu.settings.mobs_lore1",
      "",
      "@menu.settings.mobs_lore2",
    ]
    click {
      any = ["skyblock:island:flag monster_spawn"]
    }
  }

  rename {
    slot = 20
    material = "NAME_TAG"
    name = "@menu.settings.rename_name"
    lore = [
      "@menu.settings.rename_lore1",
      "@menu.settings.rename_lore2",
      "",
      "@menu.settings.rename_lore3",
    ]
    click {
      any = [
        { do = "input:island.name", prompt = "@menu.settings.prompt_island_name" },
        "skyblock:island:rename %input%"
      ]
    }
  }

  biome {
    slot = 22
    material = "GRASS_BLOCK"
    name = "@menu.settings.biome_name"
    lore = [
      "@menu.settings.biome_lore1",
      "@menu.settings.biome_lore2",
      "",
      "@menu.settings.biome_lore3",
    ]
    click {
      any = ["open:island-biome"]
    }
  }

  border {
    slot = 24
    material = "BARRIER"
    name = "@menu.settings.border_name"
    lore = [
      "@menu.settings.border_lore1",
      "@menu.settings.border_lore2",
      "",
      "@menu.settings.border_lore3",
    ]
    click {
      any = ["skyblock:island:border"]
    }
  }

  reset {
    slot = 31
    material = "TNT"
    name = "@menu.settings.reset_name"
    lore = [
      "@menu.settings.reset_lore1",
      "@menu.settings.reset_lore2",
      "",
      "@menu.settings.reset_lore3",
    ]
    click {
      any = ["skyblock:island:reset"]
    }
  }

  back {
    slot = 39
    material = "ARROW"
    name = "@menu.settings.back_name"
    lore = [
      "@menu.settings.back_lore1",
    ]
    click {
      any = ["open:island-main"]
    }
  }

  close {
    slot = 41
    material = "BARRIER"
    name = "@menu.settings.close_name"
    lore = [
      "@menu.settings.close_lore1",
    ]
    click {
      any = ["close"]
    }
  }
}
