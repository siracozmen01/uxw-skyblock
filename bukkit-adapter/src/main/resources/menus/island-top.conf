# ==============================================================================
# UXPLIMA Skyblock - Leaderboards Menu
#
# This file is the menu. Slots, materials, titles and lore are read from here,
# never decided in code. Move a slot, restart, and the slot has moved.
#
# A %argument_<name>% token is a live value the server fills when the menu opens.
# The set every island menu is given is listed in island-main.conf.
#
# A click runs the verbs named under click. Every plugin has close, open:<menu>,
# command:<line>, message:<line> and sound:<name> <volume> <pitch>. command runs
# the line as the viewer, so a server that renamed /is renames it here too.
# ==============================================================================

title = "<gradient:#FFD700:#FF55FF><b>Leaderboards</b></gradient>"
rows = 4

fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  name = " "
}

items {
  level {
    slot = 11
    material = "EXPERIENCE_BOTTLE"
    name = "<green><b>Top by Level</b></green>"
    lore = [
      "<gray>The highest island levels</gray>",
      "<gray>on this server.</gray>",
      "",
      "<yellow>Click to see the board.</yellow>",
    ]
    click {
      any = ["command:is top level"]
    }
  }

  worth {
    slot = 13
    material = "DIAMOND"
    name = "<aqua><b>Top by Worth</b></aqua>"
    lore = [
      "<gray>The most valuable islands,</gray>",
      "<gray>counted block by block.</gray>",
      "",
      "<yellow>Click to see the board.</yellow>",
    ]
    click {
      any = ["command:is top worth"]
    }
  }

  bank {
    slot = 15
    material = "GOLD_INGOT"
    name = "<gold><b>Top by Bank</b></gold>"
    lore = [
      "<gray>The richest island banks.</gray>",
      "",
      "<yellow>Click to see the board.</yellow>",
    ]
    click {
      any = ["command:is top bank"]
    }
  }

  mine {
    slot = 22
    material = "PLAYER_HEAD"
    name = "<light_purple><b>Where You Stand</b></light_purple>"
    lore = [
      "<gray>Level <white>%argument_size_tier%</white>, and what it would take</gray>",
      "<gray>to climb one place.</gray>",
      "",
      "<yellow>Click to find out.</yellow>",
    ]
    click {
      any = ["command:is level"]
    }
  }

  back {
    slot = 30
    material = "ARROW"
    name = "<yellow><b>Back</b></yellow>"
    lore = [
      "<gray>Return to the island panel.</gray>",
    ]
    click {
      any = ["open:island-main"]
    }
  }

  close {
    slot = 32
    material = "BARRIER"
    name = "<red><b>Close</b></red>"
    lore = [
      "<gray>Close this menu.</gray>",
    ]
    click {
      any = ["close"]
    }
  }
}
