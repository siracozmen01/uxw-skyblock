# ==============================================================================
# UXPLIMA Skyblock - Leaderboards Menu
#
# This file is the menu. Slots, materials, titles and lore are read from here,
# never decided in code. Move a slot, restart, and the slot has moved.
#
# A %argument_<name>% token is a live value the server fills when the menu opens.
# The set every island menu is given is listed in island-main.conf.
#
# A click runs the verbs named under click. Every plugin has close, open:<menu>,
# command:<line>, message:<line> and sound:<name> <volume> <pitch>. command runs
# the line as the viewer, so a server that renamed /is renames it here too.
# ==============================================================================

title = "@menu.top.title"
rows = 4

fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  name = " "
}

items {
  level {
    slot = 11
    material = "EXPERIENCE_BOTTLE"
    name = "@menu.top.level_name"
    lore = [
      "@menu.top.level_lore1",
      "@menu.top.level_lore2",
      "",
      "@menu.top.level_lore3",
    ]
    click {
      any = ["command:is top level"]
    }
  }

  worth {
    slot = 13
    material = "DIAMOND"
    name = "@menu.top.worth_name"
    lore = [
      "@menu.top.worth_lore1",
      "@menu.top.worth_lore2",
      "",
      "@menu.top.worth_lore3",
    ]
    click {
      any = ["command:is top worth"]
    }
  }

  bank {
    slot = 15
    material = "GOLD_INGOT"
    name = "@menu.top.bank_name"
    lore = [
      "@menu.top.bank_lore1",
      "",
      "@menu.top.bank_lore2",
    ]
    click {
      any = ["command:is top bank"]
    }
  }

  mine {
    slot = 22
    material = "PLAYER_HEAD"
    name = "@menu.top.mine_name"
    lore = [
      "@menu.top.mine_lore1",
      "@menu.top.mine_lore2",
      "",
      "@menu.top.mine_lore3",
    ]
    click {
      any = ["command:is level"]
    }
  }

  back {
    slot = 30
    material = "ARROW"
    name = "@menu.top.back_name"
    lore = [
      "@menu.top.back_lore1",
    ]
    click {
      any = ["open:island-main"]
    }
  }

  close {
    slot = 32
    material = "BARRIER"
    name = "@menu.top.close_name"
    lore = [
      "@menu.top.close_lore1",
    ]
    click {
      any = ["close"]
    }
  }
}
