# ==============================================================================
# UXPLIMA Skyblock - Island Vault Menu
#
# This file is the menu. Slots, materials, titles and lore are read from here,
# never decided in code. Move a slot, restart, and the slot has moved.
#
# A %argument_<name>% token is a live value the server fills when the menu opens.
# The set every island menu is given is listed in island-main.conf.
#
# A click runs the verbs named under click. Every plugin has close, open:<menu>,
# command:<line>, message:<line> and sound:<name> <volume> <pitch>. command runs
# the line as the viewer, so a server that renamed /is renames it here too.
# ==============================================================================

title = "<gradient:#FFAA00:#FF55FF><b>Island Vault</b></gradient>"
rows = 4

fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  name = " "
}

items {
  page1 {
    slot = 11
    material = "CHEST"
    name = "<gold><b>Vault Page 1</b></gold>"
    lore = [
      "<gray>Storage every member shares.</gray>",
      "",
      "<yellow>Click to open.</yellow>",
    ]
    click {
      any = ["command:is vault 1"]
    }
  }

  page2 {
    slot = 12
    material = "CHEST"
    name = "<gold><b>Vault Page 2</b></gold>"
    lore = [
      "<gray>Pages unlocked: <white>%argument_vault_tier%</white></gray>",
      "",
      "<yellow>Click to open.</yellow>",
    ]
    click {
      any = ["command:is vault 2"]
    }
  }

  page3 {
    slot = 13
    material = "CHEST"
    name = "<gold><b>Vault Page 3</b></gold>"
    lore = [
      "<gray>Pages unlocked: <white>%argument_vault_tier%</white></gray>",
      "",
      "<yellow>Click to open.</yellow>",
    ]
    click {
      any = ["command:is vault 3"]
    }
  }

  page4 {
    slot = 14
    material = "CHEST"
    name = "<gold><b>Vault Page 4</b></gold>"
    lore = [
      "<gray>Pages unlocked: <white>%argument_vault_tier%</white></gray>",
      "",
      "<yellow>Click to open.</yellow>",
    ]
    click {
      any = ["command:is vault 4"]
    }
  }

  more {
    slot = 15
    material = "ENDER_CHEST"
    name = "<aqua><b>More Pages</b></aqua>"
    lore = [
      "<gray>Buy another page in upgrades.</gray>",
      "",
      "<yellow>Click to go there.</yellow>",
    ]
    click {
      any = ["open:island-upgrades"]
    }
  }

  back {
    slot = 30
    material = "ARROW"
    name = "<yellow><b>Back</b></yellow>"
    lore = [
      "<gray>Return to the island panel.</gray>",
    ]
    click {
      any = ["open:island-main"]
    }
  }

  close {
    slot = 32
    material = "BARRIER"
    name = "<red><b>Close</b></red>"
    lore = [
      "<gray>Close this menu.</gray>",
    ]
    click {
      any = ["close"]
    }
  }
}
