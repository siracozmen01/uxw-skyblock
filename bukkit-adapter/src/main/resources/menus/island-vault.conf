# ==============================================================================
# UXPLIMA Skyblock - Island Vault Menu
#
# This file is the menu. Slots, materials, titles and lore are read from here,
# never decided in code. Move a slot, restart, and the slot has moved.
#
# A %argument_<name>% token is a live value the server fills when the menu opens.
# The set every island menu is given is listed in island-main.conf.
#
# A click runs the verbs named under click. Every plugin has close, open:<menu>,
# command:<line>, message:<line> and sound:<name> <volume> <pitch>. command runs
# the line as the viewer, so a server that renamed /is renames it here too.
# ==============================================================================

title = "@menu.vault.title"
rows = 4

fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  name = " "
}

items {
  page1 {
    slot = 11
    material = "CHEST"
    name = "@menu.vault.page1_name"
    lore = [
      "@menu.vault.page1_lore1",
      "",
      "@menu.vault.page1_lore2",
    ]
    click {
      any = ["skyblock:island:vault 1"]
    }
  }

  page2 {
    slot = 12
    view {
      requirements = ["at-least:vault_pages 2"]
    }
    material = "CHEST"
    name = "@menu.vault.page2_name"
    lore = [
      "@menu.vault.pages_unlocked",
      "",
      "@menu.vault.page2_lore2",
    ]
    click {
      any = ["skyblock:island:vault 2"]
    }
  }

  # Shown in the same slot while the island has fewer than 2 pages.
  page2-locked {
    slot = 12
    material = "IRON_BARS"
    view {
      requirements = ["!at-least:vault_pages 2"]
    }
    name = "@menu.vault.page2_name"
    lore = [
      "@menu.vault.locked",
      "",
      "@menu.vault.more_lore1",
      "@menu.vault.more_lore2",
    ]
    click {
      any = ["open:island-upgrades"]
    }
  }

  page3 {
    slot = 13
    view {
      requirements = ["at-least:vault_pages 3"]
    }
    material = "CHEST"
    name = "@menu.vault.page3_name"
    lore = [
      "@menu.vault.pages_unlocked",
      "",
      "@menu.vault.page3_lore2",
    ]
    click {
      any = ["skyblock:island:vault 3"]
    }
  }

  # Shown in the same slot while the island has fewer than 3 pages.
  page3-locked {
    slot = 13
    material = "IRON_BARS"
    view {
      requirements = ["!at-least:vault_pages 3"]
    }
    name = "@menu.vault.page3_name"
    lore = [
      "@menu.vault.locked",
      "",
      "@menu.vault.more_lore1",
      "@menu.vault.more_lore2",
    ]
    click {
      any = ["open:island-upgrades"]
    }
  }

  page4 {
    slot = 14
    view {
      requirements = ["at-least:vault_pages 4"]
    }
    material = "CHEST"
    name = "@menu.vault.page4_name"
    lore = [
      "@menu.vault.pages_unlocked",
      "",
      "@menu.vault.page4_lore2",
    ]
    click {
      any = ["skyblock:island:vault 4"]
    }
  }

  # Shown in the same slot while the island has fewer than 4 pages.
  page4-locked {
    slot = 14
    material = "IRON_BARS"
    view {
      requirements = ["!at-least:vault_pages 4"]
    }
    name = "@menu.vault.page4_name"
    lore = [
      "@menu.vault.locked",
      "",
      "@menu.vault.more_lore1",
      "@menu.vault.more_lore2",
    ]
    click {
      any = ["open:island-upgrades"]
    }
  }

  more {
    slot = 15
    material = "ENDER_CHEST"
    name = "@menu.vault.more_name"
    lore = [
      "@menu.vault.more_lore1",
      "",
      "@menu.vault.more_lore2",
    ]
    click {
      any = ["open:island-upgrades"]
    }
  }

  back {
    slot = 30
    material = "ARROW"
    name = "@menu.vault.back_name"
    lore = [
      "@menu.vault.back_lore1",
    ]
    click {
      any = ["open:island-main"]
    }
  }

  close {
    slot = 32
    material = "BARRIER"
    name = "@menu.vault.close_name"
    lore = [
      "@menu.vault.close_lore1",
    ]
    click {
      any = ["close"]
    }
  }
}
