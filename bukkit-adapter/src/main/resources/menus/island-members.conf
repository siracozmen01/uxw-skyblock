# ==============================================================================
# UXPLIMA Skyblock - Island Members Menu
#
# This file is the menu. Move a slot here and the slot moves in game.
#
# A click runs the verbs named under click. command:<line> runs a command as the
# viewer, so a server that renamed /is in commands.conf renames it here too.
# ==============================================================================

title = "<gradient:#55FFFF:#55FF55><b>Island Members</b></gradient>"
rows = 5

fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  name = " "
}

items {
  invite {
    slot = 38
    material = "ANVIL"
    name = "<green><b>Invite Member</b></green>"
    lore = [
      "<gray>Invite another player</gray>",
      "<gray>to join your island.</gray>",
      "",
      "<yellow>Click to invite.</yellow>"
    ]
    click {
      any = ["skyblock:invite"]
    }
  }

  permissions {
    slot = 40
    material = "WRITABLE_BOOK"
    name = "<gold><b>Role Permissions</b></gold>"
    lore = [
      "<gray>Configure role-based</gray>",
      "<gray>permissions for members.</gray>",
      "",
      "<yellow>Click to edit.</yellow>"
    ]
    click {
      any = ["skyblock:permissions"]
    }
  }

  back {
    slot = 42
    material = "ARROW"
    name = "<yellow><b>Back</b></yellow>"
    lore = [
      "<gray>Return to main menu.</gray>"
    ]
    click {
      any = ["open:island-main"]
    }
  }
}
