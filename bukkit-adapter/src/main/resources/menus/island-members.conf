# ==============================================================================
# UXPLIMA Skyblock - Island Members Menu
#
# This file is the menu. Move a slot here and the slot moves in game.
#
# A click runs the verbs named under click. command:<line> runs a command as the
# viewer, so a server that renamed /is in commands.conf renames it here too.
# ==============================================================================

title = "@menu.members.title"
rows = 5

fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  name = " "
}

items {
  invite {
    slot = 38
    material = "ANVIL"
    name = "@menu.members.invite_name"
    lore = [
      "@menu.members.invite_lore1",
      "@menu.members.invite_lore2",
      "",
      "@menu.members.invite_lore3"
    ]
    click {
      any = [
        { do = "input:member.name", prompt = "<yellow>Type the name of the player to invite.</yellow>" },
        "command:is invite %input%"
      ]
    }
  }

  permissions {
    slot = 40
    material = "WRITABLE_BOOK"
    name = "@menu.members.permissions_name"
    lore = [
      "@menu.members.permissions_lore1",
      "@menu.members.permissions_lore2",
      "",
      "@menu.members.permissions_lore3"
    ]
    click {
      any = ["skyblock:permissions"]
    }
  }

  back {
    slot = 42
    material = "ARROW"
    name = "@menu.members.back_name"
    lore = [
      "@menu.members.back_lore1"
    ]
    click {
      any = ["open:island-main"]
    }
  }
}
