# ==============================================================================
# UXPLIMA Skyblock - Island Boosters Menu
#
# This file is the menu. Slots, materials, titles and lore are read from here,
# never decided in code. Move a slot, restart, and the slot has moved.
#
# A %argument_<name>% token is a live value the server fills when the menu opens.
# The set every island menu is given is listed in island-main.conf.
#
# A click runs the verbs named under click. Every plugin has close, open:<menu>,
# command:<line>, message:<line> and sound:<name> <volume> <pitch>. command runs
# the line as the viewer, so a server that renamed /is renames it here too.
# ==============================================================================

title = "@menu.boosters.title"
rows = 5

fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  name = " "
}

items {
  active {
    slot = 13
    material = "BEACON"
    name = "@menu.boosters.active_name"
    lore = [
      "@menu.boosters.active_lore1",
      "@menu.boosters.active_lore2",
      "",
      "@menu.boosters.active_lore3",
    ]
    click {
      any = ["skyblock:island:booster"]
    }
  }

  spawner {
    slot = 20
    material = "SPAWNER"
    name = "@menu.boosters.spawner_name"
    lore = [
      "@menu.boosters.spawner_lore1",
      "@menu.boosters.spawner_lore2",
      "",
      "@menu.boosters.spawner_lore3",
    ]
    click {
      any = ["skyblock:island:booster"]
    }
  }

  mobexp {
    slot = 22
    material = "EXPERIENCE_BOTTLE"
    name = "@menu.boosters.mobexp_name"
    lore = [
      "@menu.boosters.mobexp_lore1",
      "@menu.boosters.mobexp_lore2",
      "",
      "@menu.boosters.mobexp_lore3",
    ]
    click {
      any = ["skyblock:island:booster"]
    }
  }

  crops {
    slot = 24
    material = "WHEAT"
    name = "@menu.boosters.crops_name"
    lore = [
      "@menu.boosters.crops_lore1",
      "@menu.boosters.crops_lore2",
      "",
      "@menu.boosters.crops_lore3",
    ]
    click {
      any = ["skyblock:island:booster"]
    }
  }

  back {
    slot = 39
    material = "ARROW"
    name = "@menu.boosters.back_name"
    lore = [
      "@menu.boosters.back_lore1",
    ]
    click {
      any = ["open:island-main"]
    }
  }

  close {
    slot = 41
    material = "BARRIER"
    name = "@menu.boosters.close_name"
    lore = [
      "@menu.boosters.close_lore1",
    ]
    click {
      any = ["close"]
    }
  }
}
