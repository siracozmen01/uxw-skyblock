# ==============================================================================
# UXPLIMA Skyblock - Island Boosters Menu
#
# This file is the menu. Slots, materials, titles and lore are read from here,
# never decided in code. Move a slot, restart, and the slot has moved.
#
# A %argument_<name>% token is a live value the server fills when the menu opens.
# The set every island menu is given is listed in island-main.conf.
#
# A click runs the verbs named under click. Every plugin has close, open:<menu>,
# command:<line>, message:<line> and sound:<name> <volume> <pitch>. command runs
# the line as the viewer, so a server that renamed /is renames it here too.
# ==============================================================================

title = "<gradient:#FF55FF:#FFAA00><b>Boosters</b></gradient>"
rows = 5

fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  name = " "
}

items {
  active {
    slot = 13
    material = "BEACON"
    name = "<aqua><b>Active Boosters</b></aqua>"
    lore = [
      "<gray>What is running on this island</gray>",
      "<gray>right now, and for how long.</gray>",
      "",
      "<yellow>Click to list them.</yellow>",
    ]
    click {
      any = ["command:is booster list"]
    }
  }

  spawner {
    slot = 20
    material = "SPAWNER"
    name = "<red><b>Spawner Rate</b></red>"
    lore = [
      "<gray>Spawners tick faster while it runs.</gray>",
      "",
      "<yellow>Click to buy.</yellow>",
    ]
    click {
      any = ["command:is booster buy spawner_rate"]
    }
  }

  mobexp {
    slot = 22
    material = "EXPERIENCE_BOTTLE"
    name = "<green><b>Mob Experience</b></green>"
    lore = [
      "<gray>Mobs drop more experience.</gray>",
      "",
      "<yellow>Click to buy.</yellow>",
    ]
    click {
      any = ["command:is booster buy mob_exp"]
    }
  }

  crops {
    slot = 24
    material = "WHEAT"
    name = "<yellow><b>Crop Growth</b></yellow>"
    lore = [
      "<gray>Crops grow faster.</gray>",
      "",
      "<yellow>Click to buy.</yellow>",
    ]
    click {
      any = ["command:is booster buy crop_growth"]
    }
  }

  back {
    slot = 39
    material = "ARROW"
    name = "<yellow><b>Back</b></yellow>"
    lore = [
      "<gray>Return to the island panel.</gray>",
    ]
    click {
      any = ["open:island-main"]
    }
  }

  close {
    slot = 41
    material = "BARRIER"
    name = "<red><b>Close</b></red>"
    lore = [
      "<gray>Close this menu.</gray>",
    ]
    click {
      any = ["close"]
    }
  }
}
