# ==============================================================================
# UXPLIMA Skyblock - Island Social Menu
#
# This file is the menu. Slots, materials, titles and lore are read from here,
# never decided in code. Move a slot, restart, and the slot has moved.
#
# A %argument_<name>% token is a live value the server fills when the menu opens.
# The set every island menu is given is listed in island-main.conf.
#
# A click runs the verbs named under click. Every plugin has close, open:<menu>,
# command:<line>, message:<line> and sound:<name> <volume> <pitch>. command runs
# the line as the viewer, so a server that renamed /is renames it here too.
# ==============================================================================

title = "<gradient:#55FFFF:#55FF55><b>Island Social</b></gradient>"
rows = 5

fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  name = " "
}

items {
  guestbook {
    slot = 11
    material = "WRITABLE_BOOK"
    name = "<gold><b>Guestbook</b></gold>"
    lore = [
      "<gray>What visitors wrote about</gray>",
      "<gray>this island.</gray>",
      "",
      "<yellow>Click to read.</yellow>",
    ]
    click {
      any = ["command:is guestbook"]
    }
  }

  rate {
    slot = 13
    material = "NETHER_STAR"
    name = "<yellow><b>Rate an Island</b></yellow>"
    lore = [
      "<gray>Give the island you are standing</gray>",
      "<gray>on a score out of five.</gray>",
      "",
      "<yellow>Click to rate.</yellow>",
    ]
    click {
      any = ["command:is rate"]
    }
  }

  bookmarks {
    slot = 15
    material = "MAP"
    name = "<aqua><b>Bookmarks</b></aqua>"
    lore = [
      "<gray>The islands you saved to</gray>",
      "<gray>come back to.</gray>",
      "",
      "<yellow>Click to list them.</yellow>",
    ]
    click {
      any = ["command:is bookmarks"]
    }
  }

  alliances {
    slot = 20
    material = "SHIELD"
    name = "<blue><b>Alliances</b></blue>"
    lore = [
      "<gray>Islands yours has an alliance with.</gray>",
      "<gray>Allies do not hurt each other.</gray>",
      "",
      "<yellow>Click to manage.</yellow>",
    ]
    click {
      any = ["command:is alliance"]
    }
  }

  chat {
    slot = 22
    material = "PAPER"
    name = "<green><b>Island Chat</b></green>"
    lore = [
      "<gray>Talk to your members only.</gray>",
      "",
      "<yellow>Click to switch channel.</yellow>",
    ]
    click {
      any = ["command:is chat"]
    }
  }

  activity {
    slot = 24
    material = "CLOCK"
    name = "<light_purple><b>Activity</b></light_purple>"
    lore = [
      "<gray>What happened on this island</gray>",
      "<gray>while you were away.</gray>",
      "",
      "<yellow>Click to read.</yellow>",
    ]
    click {
      any = ["command:is activity"]
    }
  }

  back {
    slot = 39
    material = "ARROW"
    name = "<yellow><b>Back</b></yellow>"
    lore = [
      "<gray>Return to the island panel.</gray>",
    ]
    click {
      any = ["open:island-main"]
    }
  }

  close {
    slot = 41
    material = "BARRIER"
    name = "<red><b>Close</b></red>"
    lore = [
      "<gray>Close this menu.</gray>",
    ]
    click {
      any = ["close"]
    }
  }
}
