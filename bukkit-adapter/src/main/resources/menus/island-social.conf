# ==============================================================================
# UXPLIMA Skyblock - Island Social Menu
#
# This file is the menu. Slots, materials, titles and lore are read from here,
# never decided in code. Move a slot, restart, and the slot has moved.
#
# A %argument_<name>% token is a live value the server fills when the menu opens.
# The set every island menu is given is listed in island-main.conf.
#
# A click runs the verbs named under click. Every plugin has close, open:<menu>,
# command:<line>, message:<line> and sound:<name> <volume> <pitch>. command runs
# the line as the viewer, so a server that renamed /is renames it here too.
# ==============================================================================

title = "@menu.social.title"
rows = 5

fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  name = " "
}

items {
  guestbook {
    slot = 11
    material = "WRITABLE_BOOK"
    name = "@menu.social.guestbook_name"
    lore = [
      "@menu.social.guestbook_lore1",
      "@menu.social.guestbook_lore2",
      "",
      "@menu.social.guestbook_lore3",
    ]
    click {
      any = ["skyblock:island:guestbook"]
    }
  }

  rate {
    slot = 13
    material = "NETHER_STAR"
    name = "@menu.social.rate_name"
    lore = [
      "@menu.social.rate_lore1",
      "@menu.social.rate_lore2",
      "",
      "@menu.social.rate_lore3",
    ]
    click {
      any = ["skyblock:island:rate"]
    }
  }

  bookmarks {
    slot = 15
    material = "MAP"
    name = "@menu.social.bookmarks_name"
    lore = [
      "@menu.social.bookmarks_lore1",
      "@menu.social.bookmarks_lore2",
      "",
      "@menu.social.bookmarks_lore3",
    ]
    click {
      any = ["skyblock:island:bookmarks"]
    }
  }

  alliances {
    slot = 20
    material = "SHIELD"
    name = "@menu.social.alliances_name"
    lore = [
      "@menu.social.alliances_lore1",
      "@menu.social.alliances_lore2",
      "",
      "@menu.social.alliances_lore3",
    ]
    click {
      any = ["skyblock:island:alliance"]
    }
  }

  chat {
    slot = 22
    material = "PAPER"
    name = "@menu.social.chat_name"
    lore = [
      "@menu.social.chat_lore1",
      "",
      "@menu.social.chat_lore2",
    ]
    click {
      any = ["skyblock:island:chat"]
    }
  }

  activity {
    slot = 24
    material = "CLOCK"
    name = "@menu.social.activity_name"
    lore = [
      "@menu.social.activity_lore1",
      "@menu.social.activity_lore2",
      "",
      "@menu.social.activity_lore3",
    ]
    click {
      any = ["skyblock:island:activity"]
    }
  }

  back {
    slot = 39
    material = "ARROW"
    name = "@menu.social.back_name"
    lore = [
      "@menu.social.back_lore1",
    ]
    click {
      any = ["open:island-main"]
    }
  }

  close {
    slot = 41
    material = "BARRIER"
    name = "@menu.social.close_name"
    lore = [
      "@menu.social.close_lore1",
    ]
    click {
      any = ["close"]
    }
  }
}
