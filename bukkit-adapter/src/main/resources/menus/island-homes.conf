# ==============================================================================
# UXPLIMA Skyblock - Island Homes Menu
#
# This file is the menu. Slots, materials, titles and lore are read from here,
# never decided in code. Move a slot, restart, and the slot has moved.
#
# A %argument_<name>% token is a live value the server fills when the menu opens.
# The set every island menu is given is listed in island-main.conf.
#
# A click runs the verbs named under click. Every plugin has close, open:<menu>,
# command:<line>, message:<line> and sound:<name> <volume> <pitch>. command runs
# the line as the viewer, so a server that renamed /is renames it here too.
# ==============================================================================

title = "@menu.homes.title"
rows = 4

fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  name = " "
}

items {
  list {
    slot = 11
    material = "COMPASS"
    name = "@menu.homes.list_name"
    lore = [
      "@menu.homes.list_lore1",
      "",
      "@menu.homes.list_lore2",
    ]
    click {
      any = ["skyblock:island:homes"]
    }
  }

  sethome {
    slot = 13
    material = "RED_BED"
    name = "@menu.homes.sethome_name"
    lore = [
      "@menu.homes.sethome_lore1",
      "@menu.homes.sethome_lore2",
      "",
      "@menu.homes.sethome_lore3",
    ]
    click {
      any = [
        { do = "input:home.name", prompt = "@menu.homes.prompt_home_name" },
        "skyblock:island:sethome %input%"
      ]
    }
  }

  island {
    slot = 15
    material = "ENDER_PEARL"
    name = "@menu.homes.island_name"
    lore = [
      "@menu.homes.island_lore1",
      "",
      "@menu.homes.island_lore2",
    ]
    click {
      any = ["skyblock:island:home"]
    }
  }

  setspawn {
    slot = 22
    material = "BEACON"
    name = "@menu.homes.setspawn_name"
    lore = [
      "@menu.homes.setspawn_lore1",
      "@menu.homes.setspawn_lore2",
      "",
      "@menu.homes.setspawn_lore3",
    ]
    click {
      any = ["skyblock:island:setspawn"]
    }
  }

  back {
    slot = 30
    material = "ARROW"
    name = "@menu.homes.back_name"
    lore = [
      "@menu.homes.back_lore1",
    ]
    click {
      any = ["open:island-main"]
    }
  }

  close {
    slot = 32
    material = "BARRIER"
    name = "@menu.homes.close_name"
    lore = [
      "@menu.homes.close_lore1",
    ]
    click {
      any = ["close"]
    }
  }
}
