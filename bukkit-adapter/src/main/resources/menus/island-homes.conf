# ==============================================================================
# UXPLIMA Skyblock - Island Homes Menu
#
# This file is the menu. Slots, materials, titles and lore are read from here,
# never decided in code. Move a slot, restart, and the slot has moved.
#
# A %argument_<name>% token is a live value the server fills when the menu opens.
# The set every island menu is given is listed in island-main.conf.
#
# A click runs the verbs named under click. Every plugin has close, open:<menu>,
# command:<line>, message:<line> and sound:<name> <volume> <pitch>. command runs
# the line as the viewer, so a server that renamed /is renames it here too.
# ==============================================================================

title = "<gradient:#FF55FF:#5555FF><b>Homes</b></gradient>"
rows = 4

fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  name = " "
}

items {
  list {
    slot = 11
    material = "COMPASS"
    name = "<aqua><b>Your Homes</b></aqua>"
    lore = [
      "<gray>Every point you have marked.</gray>",
      "",
      "<yellow>Click to list them.</yellow>",
    ]
    click {
      any = ["command:is homes"]
    }
  }

  sethome {
    slot = 13
    material = "RED_BED"
    name = "<green><b>Set a Home</b></green>"
    lore = [
      "<gray>Mark where you stand so you can</gray>",
      "<gray>come straight back to it.</gray>",
      "",
      "<yellow>Click and type a name.</yellow>",
    ]
    click {
      any = [
        { do = "input:home.name", prompt = "<yellow>Type a name for this home.</yellow>" },
        "command:is sethome %input%"
      ]
    }
  }

  island {
    slot = 15
    material = "ENDER_PEARL"
    name = "<gold><b>Island Spawn</b></gold>"
    lore = [
      "<gray>Go to where your island begins.</gray>",
      "",
      "<yellow>Click to teleport.</yellow>",
    ]
    click {
      any = ["command:is home"]
    }
  }

  setspawn {
    slot = 22
    material = "BEACON"
    name = "<light_purple><b>Move Island Spawn</b></light_purple>"
    lore = [
      "<gray>Make where you stand the point</gray>",
      "<gray>every member arrives at.</gray>",
      "",
      "<yellow>Click to set it.</yellow>",
    ]
    click {
      any = ["command:is setspawn"]
    }
  }

  back {
    slot = 30
    material = "ARROW"
    name = "<yellow><b>Back</b></yellow>"
    lore = [
      "<gray>Return to the island panel.</gray>",
    ]
    click {
      any = ["open:island-main"]
    }
  }

  close {
    slot = 32
    material = "BARRIER"
    name = "<red><b>Close</b></red>"
    lore = [
      "<gray>Close this menu.</gray>",
    ]
    click {
      any = ["close"]
    }
  }
}
