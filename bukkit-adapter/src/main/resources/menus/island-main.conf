      "<gray>Size <white>%argument_size_tier%</white>, members <white>%argument_members_tier%</white>.</gray>",
      "<gray>Generator <white>%argument_generator_tier%</white>, vault <white>%argument_vault_tier%</white>.</gray>",
      "",
      "@menu.main.upgrades_lore3"
    ]
    click {
      any = ["open:island-upgrades"]
    }
  }

