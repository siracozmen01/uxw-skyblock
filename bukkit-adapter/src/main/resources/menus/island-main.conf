# ==============================================================================
# UXPLIMA Skyblock - Main Island Menu
#
# This file is the menu. Slots, materials, titles, lore and sounds are read from
# here, never decided in code. Change a slot, restart, and the slot has moved.
#
# A %argument_<name>% token is a live value the server fills when the menu opens.
# The ones this menu is given are:
#   %argument_island%          the island's id
#   %argument_balance%         the primary bank balance
#   %argument_crystals%        the crystal balance
#   %argument_exp%             the banked experience
#   %argument_member_count%    how many members the island has
#   %argument_radius%          the island's radius in blocks
#   %argument_center_x%        the island centre, x
#   %argument_center_z%        the island centre, z
#   %argument_size_tier%       the SIZE upgrade tier
#   %argument_members_tier%    the MEMBERS upgrade tier
#   %argument_warps_tier%      the WARPS upgrade tier
#   %argument_spawner_tier%    the SPAWNER_SPEED upgrade tier
#   %argument_generator_tier%  the ORE_GENERATOR upgrade tier
#   %argument_vault_tier%      the VAULT_PAGES upgrade tier
#
# A click runs the verbs named under click. The verbs this plugin adds are
# skyblock:teleport-home, skyblock:bank, skyblock:upgrades, skyblock:members and
# skyblock:settings. The verbs every plugin has are close, open:<menu>,
# command:<line>, message:<line> and sound:<name> <volume> <pitch>.
# ==============================================================================

title = "@menu.main.title"
rows = 6

fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  name = " "
}

items {
  teleport {
    slot = 11
    material = "ENDER_PEARL"
    name = "@menu.main.teleport_name"
    lore = [
      "@menu.main.teleport_lore1",
      "",
      "@menu.main.teleport_lore2"
    ]
    click {
      any = ["skyblock:teleport-home"]
    }
  }

  bank {
    slot = 13
    material = "GOLD_INGOT"
    name = "@menu.main.bank_name"
    lore = [
      "<gray>Primary Balance: <yellow>%argument_balance%</yellow></gray>",
      "<gray>Crystals: <aqua>%argument_crystals%</aqua></gray>",
      "",
      "@menu.main.bank_lore3",
      "@menu.main.bank_lore4"
    ]
    click {
      any = ["open:island-bank"]
    }
  }

  upgrades {
