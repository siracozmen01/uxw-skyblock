# ==============================================================================
# UXPLIMA Skyblock - Main Island Menu Configuration
# ==============================================================================

title = "<gradient:#4A90E2:#50E3C2><b>Island Control Panel</b></gradient>"
rows = 6

# Fill background with filler item
filler {
  material = "GRAY_STAINED_GLASS_PANE"
  name = " "
}

items {
  teleport {
    slot = 11
    material = "ENDER_PEARL"
    name = "<green><b>Teleport Home</b></green>"
    lore = [
      "<gray>Teleport to your island center.</gray>",
      "",
      "<yellow>Click to teleport!</yellow>"
    ]
  }

  bank {
    slot = 13
    material = "GOLD_INGOT"
    name = "<gold><b>Island Bank</b></gold>"
    lore = [
      "<gray>Primary Balance: <yellow>{balance}</yellow></gray>",
      "<gray>Bank Level: <aqua>{bank_level}</aqua></gray>",
      "",
      "<yellow>Left-Click to deposit.</yellow>",
      "<yellow>Right-Click to withdraw.</yellow>"
    ]
  }

  upgrades {
    slot = 15
    material = "NETHERITE_UPGRADE_SMITHING_TEMPLATE"
    name = "<aqua><b>Island Upgrades</b></aqua>"
    lore = [
      "<gray>View and unlock tier upgrades</gray>",
      "<gray>for size, members, and generators.</gray>",
      "",
      "<yellow>Click to open!</yellow>"
    ]
  }

  members {
    slot = 29
    material = "PLAYER_HEAD"
    name = "<blue><b>Member Management</b></blue>"
    lore = [
      "<gray>Members: <white>{member_count}/{max_members}</white></gray>",
      "",
      "<yellow>Click to view roster.</yellow>"
    ]
  }

  settings {
    slot = 31
    material = "REDSTONE_TORCH"
    name = "<red><b>Island Settings</b></red>"
    lore = [
      "<gray>Configure privacy, PvP,</gray>",
      "<gray>and visitor permissions.</gray>",
      "",
      "<yellow>Click to manage.</yellow>"
    ]
  }

  close {
    slot = 49
    material = "BARRIER"
    name = "<red><b>Close</b></red>"
    lore = [
      "<gray>Exit the control panel.</gray>"
    ]
  }
}
