# ==============================================================================
# UXPLIMA Skyblock - Island Missions Menu
#
# This file is the menu. Slots, materials, titles and lore are read from here,
# never decided in code. Move a slot, restart, and the slot has moved.
#
# A %argument_<name>% token is a live value the server fills when the menu opens.
# The set every island menu is given is listed in island-main.conf.
#
# A click runs the verbs named under click. Every plugin has close, open:<menu>,
# command:<line>, message:<line> and sound:<name> <volume> <pitch>. command runs
# the line as the viewer, so a server that renamed /is renames it here too.
# ==============================================================================

title = "@menu.missions.title"
rows = 5

fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  name = " "
}

items {
  daily {
    slot = 11
    material = "CLOCK"
    name = "@menu.missions.daily_name"
    lore = [
      "@menu.missions.daily_lore1",
      "@menu.missions.daily_lore2",
      "",
      "@menu.missions.daily_lore3",
    ]
    click {
      any = ["skyblock:island:missions"]
    }
  }

  weekly {
    slot = 13
    material = "BOOK"
    name = "@menu.missions.weekly_name"
    lore = [
      "@menu.missions.weekly_lore1",
      "",
      "@menu.missions.weekly_lore2",
    ]
    click {
      any = ["skyblock:island:challenges"]
    }
  }

  challenges {
    slot = 15
    material = "NETHER_STAR"
    name = "@menu.missions.challenges_name"
    lore = [
      "@menu.missions.challenges_lore1",
      "",
      "@menu.missions.challenges_lore2",
    ]
    click {
      any = ["skyblock:island:challenges"]
    }
  }

  rewards {
    slot = 22
    material = "CHEST_MINECART"
    name = "@menu.missions.rewards_name"
    lore = [
      "@menu.missions.rewards_lore1",
      "@menu.missions.rewards_lore2",
      "",
      "@menu.missions.rewards_lore3",
    ]
    click {
      any = ["skyblock:island:rewards claim"]
    }
  }

  back {
    slot = 39
    material = "ARROW"
    name = "@menu.missions.back_name"
    lore = [
      "@menu.missions.back_lore1",
    ]
    click {
      any = ["open:island-main"]
    }
  }

  close {
    slot = 41
    material = "BARRIER"
    name = "@menu.missions.close_name"
    lore = [
      "@menu.missions.close_lore1",
    ]
    click {
      any = ["close"]
    }
  }
}
