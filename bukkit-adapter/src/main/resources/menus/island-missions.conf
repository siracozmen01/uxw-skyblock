# ==============================================================================
# UXPLIMA Skyblock - Island Missions Menu
#
# This file is the menu. Slots, materials, titles and lore are read from here,
# never decided in code. Move a slot, restart, and the slot has moved.
#
# A %argument_<name>% token is a live value the server fills when the menu opens.
# The set every island menu is given is listed in island-main.conf.
#
# A click runs the verbs named under click. Every plugin has close, open:<menu>,
# command:<line>, message:<line> and sound:<name> <volume> <pitch>. command runs
# the line as the viewer, so a server that renamed /is renames it here too.
# ==============================================================================

title = "<gradient:#55FF55:#00AAAA><b>Missions</b></gradient>"
rows = 5

fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  name = " "
}

items {
  daily {
    slot = 11
    material = "CLOCK"
    name = "<green><b>Daily Missions</b></green>"
    lore = [
      "<gray>Reset every day. Small rewards,</gray>",
      "<gray>and they add up.</gray>",
      "",
      "<yellow>Click to see today's.</yellow>",
    ]
    click {
      any = ["command:is missions daily"]
    }
  }

  weekly {
    slot = 13
    material = "BOOK"
    name = "<aqua><b>Weekly Missions</b></aqua>"
    lore = [
      "<gray>Harder, and worth more.</gray>",
      "",
      "<yellow>Click to see this week's.</yellow>",
    ]
    click {
      any = ["command:is missions weekly"]
    }
  }

  challenges {
    slot = 15
    material = "NETHER_STAR"
    name = "<light_purple><b>Challenges</b></light_purple>"
    lore = [
      "<gray>One off goals with one off rewards.</gray>",
      "",
      "<yellow>Click to browse.</yellow>",
    ]
    click {
      any = ["command:is challenges"]
    }
  }

  rewards {
    slot = 22
    material = "CHEST_MINECART"
    name = "<gold><b>Claim Rewards</b></gold>"
    lore = [
      "<gray>Everything you have earned and</gray>",
      "<gray>not yet collected.</gray>",
      "",
      "<yellow>Click to claim.</yellow>",
    ]
    click {
      any = ["command:is rewards claim"]
    }
  }

  back {
    slot = 39
    material = "ARROW"
    name = "<yellow><b>Back</b></yellow>"
    lore = [
      "<gray>Return to the island panel.</gray>",
    ]
    click {
      any = ["open:island-main"]
    }
  }

  close {
    slot = 41
    material = "BARRIER"
    name = "<red><b>Close</b></red>"
    lore = [
      "<gray>Close this menu.</gray>",
    ]
    click {
      any = ["close"]
    }
  }
}
