# ==============================================================================
# UXPLIMA Skyblock - OneBlock Menu
#
# This file is the menu the oneblock command opens on a OneBlock island. Slots,
# materials, titles and lore are read from here, never decided in code. A
# Bedrock player gets the same items as the buttons of a native form.
#
# A %argument_<name>% token, or <argument_<name>> in a language line, is a live
# value the server fills when the menu opens:
#   phase           the phase's title in the viewer's language
#   phase_id        the phase's name in modules/oneblock.conf
#   phase_number    which phase, from 1
#   phase_count     how many phases there are
#   blocks_broken   every block the island has broken
#   phase_blocks    breaks into the phase
#   phase_length    how many breaks the phase lasts
#   phase_left      how many breaks remain in the phase
#   phase_percent   how far through the phase, from 0 to 100
#
# A click runs the verbs named under click. Every plugin has close, open:<menu>,
# command:<line>, message:<line> and sound:<name> <volume> <pitch>.
# ==============================================================================

title = "@menu.oneblock.title"
rows = 3

fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  name = " "
}

items {
  phase {
    slot = 11
    material = "GRASS_BLOCK"
    name = "@menu.oneblock.phase_name"
    lore = [
      "@menu.oneblock.phase_lore1",
    ]
    click {
      any = ["message:@menu.oneblock.note"]
    }
  }

  progress {
    slot = 13
    material = "EXPERIENCE_BOTTLE"
    name = "@menu.oneblock.progress_name"
    lore = [
      "@menu.oneblock.progress_lore1",
      "@menu.oneblock.progress_lore2",
    ]
    click {
      any = ["message:@menu.oneblock.note"]
    }
  }

  broken {
    slot = 15
    material = "IRON_PICKAXE"
    name = "@menu.oneblock.broken_name"
    lore = [
      "@menu.oneblock.broken_lore1",
    ]
    click {
      any = ["message:@menu.oneblock.note"]
    }
  }

  close {
    slot = 22
    material = "BARRIER"
    name = "@menu.oneblock.close_name"
    click {
      any = ["close"]
    }
  }
}
