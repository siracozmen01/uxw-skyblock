# ==============================================================================
# UXPLIMA Skyblock - Island Bank Menu
#
# This file is the menu. Slots, materials, titles and lore are read from here,
# never decided in code. Move a slot, restart, and the slot has moved.
#
# A %argument_<name>% token is a live value the server fills when the menu opens.
# The set every island menu is given is listed in island-main.conf.
#
# A click runs the verbs named under click. Every plugin has close, open:<menu>,
# command:<line>, message:<line> and sound:<name> <volume> <pitch>. command runs
# the line as the viewer, so a server that renamed /is renames it here too.
# ==============================================================================

title = "@menu.bank.title"
rows = 5

fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  name = " "
}

items {
  balance {
    slot = 13
    material = "GOLD_BLOCK"
    name = "@menu.bank.balance_name"
    lore = [
      "<gray>Coins: <yellow>%argument_balance%</yellow></gray>",
      "<gray>Crystals: <aqua>%argument_crystals%</aqua></gray>",
      "<gray>Banked experience: <green>%argument_exp%</green></gray>",
    ]
    click {
      any = ["message:<gray>The island bank is shared by every member.</gray>"]
    }
  }

  # The amounts are the operator's. Change a number here and the button moves that much.
  deposit_small {
    slot = 19
    material = "IRON_NUGGET"
    name = "@menu.bank.deposit_small_name"
    lore = [
      "@menu.bank.deposit_small_lore1",
      "@menu.bank.deposit_small_lore2",
    ]
    click {
      any = ["command:is bank deposit 100"]
    }
  }

  deposit_large {
    slot = 20
    material = "GOLD_INGOT"
    name = "@menu.bank.deposit_large_name"
    lore = [
      "@menu.bank.deposit_large_lore1",
      "@menu.bank.deposit_large_lore2",
    ]
    click {
      any = ["command:is bank deposit 1000"]
    }
  }

  withdraw_small {
    slot = 24
    material = "IRON_NUGGET"
    name = "@menu.bank.withdraw_small_name"
    lore = [
      "@menu.bank.withdraw_small_lore1",
      "@menu.bank.withdraw_small_lore2",
    ]
    click {
      any = ["command:is bank withdraw 100"]
    }
  }

  withdraw_large {
    slot = 25
    material = "GOLD_INGOT"
    name = "@menu.bank.withdraw_large_name"
    lore = [
      "@menu.bank.withdraw_large_lore1",
      "@menu.bank.withdraw_large_lore2",
    ]
    click {
      any = ["command:is bank withdraw 1000"]
    }
  }

  upkeep {
    slot = 31
    material = "CLOCK"
    name = "@menu.bank.upkeep_name"
    lore = [
      "@menu.bank.upkeep_lore1",
      "",
      "@menu.bank.upkeep_lore2",
    ]
    click {
      any = ["command:is bank upkeep"]
    }
  }

  back {
    slot = 39
    material = "ARROW"
    name = "@menu.bank.back_name"
    lore = [
      "@menu.bank.back_lore1",
    ]
    click {
      any = ["open:island-main"]
    }
  }

  close {
    slot = 41
    material = "BARRIER"
    name = "@menu.bank.close_name"
    lore = [
      "@menu.bank.close_lore1",
    ]
    click {
      any = ["close"]
    }
  }
}
