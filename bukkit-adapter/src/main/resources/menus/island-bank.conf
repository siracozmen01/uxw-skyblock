# ==============================================================================
# UXPLIMA Skyblock - Island Bank Menu
#
# This file is the menu. Slots, materials, titles and lore are read from here,
# never decided in code. Move a slot, restart, and the slot has moved.
#
# A %argument_<name>% token is a live value the server fills when the menu opens.
# The set every island menu is given is listed in island-main.conf.
#
# A click runs the verbs named under click. Every plugin has close, open:<menu>,
# command:<line>, message:<line> and sound:<name> <volume> <pitch>. command runs
# the line as the viewer, so a server that renamed /is renames it here too.
# ==============================================================================

title = "<gradient:#FFD700:#FFA500><b>Island Bank</b></gradient>"
rows = 5

fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  name = " "
}

items {
  balance {
    slot = 13
    material = "GOLD_BLOCK"
    name = "<gold><b>Island Balance</b></gold>"
    lore = [
      "<gray>Coins: <yellow>%argument_balance%</yellow></gray>",
      "<gray>Crystals: <aqua>%argument_crystals%</aqua></gray>",
      "<gray>Banked experience: <green>%argument_exp%</green></gray>",
    ]
    click {
      any = ["message:<gray>The island bank is shared by every member.</gray>"]
    }
  }

  deposit {
    slot = 20
    material = "HOPPER"
    name = "<green><b>Deposit</b></green>"
    lore = [
      "<gray>Move coins from your wallet</gray>",
      "<gray>into the island bank.</gray>",
      "",
      "<yellow>Click to be asked for an amount.</yellow>",
    ]
    click {
      any = ["command:is bank deposit"]
    }
  }

  withdraw {
    slot = 24
    material = "DROPPER"
    name = "<red><b>Withdraw</b></red>"
    lore = [
      "<gray>Take coins out of the island</gray>",
      "<gray>bank and into your wallet.</gray>",
      "",
      "<yellow>Click to be asked for an amount.</yellow>",
    ]
    click {
      any = ["command:is bank withdraw"]
    }
  }

  upkeep {
    slot = 31
    material = "CLOCK"
    name = "<light_purple><b>Upkeep</b></light_purple>"
    lore = [
      "<gray>What this island owes, and when.</gray>",
      "",
      "<yellow>Click to read the ledger.</yellow>",
    ]
    click {
      any = ["command:is upkeep"]
    }
  }

  back {
    slot = 39
    material = "ARROW"
    name = "<yellow><b>Back</b></yellow>"
    lore = [
      "<gray>Return to the island panel.</gray>",
    ]
    click {
      any = ["open:island-main"]
    }
  }

  close {
    slot = 41
    material = "BARRIER"
    name = "<red><b>Close</b></red>"
    lore = [
      "<gray>Close this menu.</gray>",
    ]
    click {
      any = ["close"]
    }
  }
}
