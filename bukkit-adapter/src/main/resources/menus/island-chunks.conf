# ==============================================================================
# UXPLIMA Skyblock - ChunkBlock Menu
#
# This file is the menu the chunks command opens on a ChunkBlock island. Slots,
# materials, titles and lore are read from here, never decided in code. A
# Bedrock player gets the same items as the buttons of a native form.
#
# A %argument_<name>% token, or <argument_<name>> in a language line, is a live
# value the server fills when the menu opens:
#   open_chunks    how many chunks the island has open, the first among them
#   next_level     the level the next chunk needs
#   level          the island's level
#   levels_to_go   how many levels until the next chunk, 0 when it can open now
#
# A click runs the verbs named under click. Every plugin has close, open:<menu>,
# command:<line>, message:<line> and sound:<name> <volume> <pitch>. The skyblock
# verb skyblock:island:<branch> runs an island command under this server's names
# for it: skyblock:island:chunks unlock opens the chunk the player faces.
# ==============================================================================

title = "@menu.chunks.title"
rows = 3

fill-item {
  material = "GRAY_STAINED_GLASS_PANE"
  name = " "
}

items {
  open {
    slot = 11
    material = "GRASS_BLOCK"
    name = "@menu.chunks.open_name"
    lore = [
      "@menu.chunks.open_lore1",
    ]
    click {
      any = ["message:@menu.chunks.note"]
    }
  }

  next {
    slot = 13
    material = "EXPERIENCE_BOTTLE"
    name = "@menu.chunks.next_name"
    lore = [
      "@menu.chunks.next_lore1",
      "@menu.chunks.next_lore2",
    ]
    click {
      any = ["message:@menu.chunks.note"]
    }
  }

  unlock {
    slot = 15
    material = "FILLED_MAP"
    name = "@menu.chunks.unlock_name"
    lore = [
      "@menu.chunks.unlock_lore1",
    ]
    click {
      any = ["close", "skyblock:island:chunks unlock"]
    }
  }

  close {
    slot = 22
    material = "BARRIER"
    name = "@menu.chunks.close_name"
    click {
      any = ["close"]
    }
  }
}
