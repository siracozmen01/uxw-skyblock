# ==============================================================================
# UXPLIMA Skyblock - Dynamic Shop Pricing & Speculation Damping Configuration
# ==============================================================================

shop {
    # Whether the dynamic pricing engine is enabled.
    enabled = true

    # Damping factor to smooth price fluctuations and neutralize market speculation arbitrage (0.0 < factor <= 1.0).
    damping-factor = 0.85

    # Background refresh interval for external shops without instant event triggers (e.g. 2m).
    async-refresh-interval = "2m"

    # Default baseline stock volume unit for unconfigured items.
    default-stock-baseline = 100

    # Default elasticity factor for unconfigured items.
    default-elasticity = 0.5
}
