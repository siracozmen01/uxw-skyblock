# ==============================================================================
# UXPLIMA Skyblock - Feature Modules Configuration (HOCON)
# Explicit descriptors, DAG startup ordering, fail-fast dependency enforcement,
# and restart-only lifecycle.
# ==============================================================================

# Enable or disable built-in internal feature modules.
# Inactive modules consume zero runtime scheduling ticks, register zero Bukkit listeners,
# and initialize zero in-memory caches (zero-resource footprint).
#
# NOTE: Changing these settings strictly requires a server restart.
# Dynamic hot-reloading of modules is disabled to prevent memory leaks and dangling resources.
modules {
    # Core domain, identity, profile management and grid allocation (Tier 1 Mandatory)
    core = true

    # Island bank and multi-currency economy (Tier 2 Required Provider)
    bank = true

    # Island upgrades engine
    upgrades = true

    # Island biome manipulation engine
    biomes = true

    # Island starter schematic presets
    presets = true

    # Automated competitive seasons and scheduled payouts
    seasons = true

    # Social discovery, ratings, and visitor guestbook
    social = true

    # Standalone Discord webhook notification subsystem
    discord = true

    # Island alliances and diplomatic relations
    alliances = true

    # Dynamic shop pricing subsystem with supply/demand curves
    shop = true

    # Expiring temporary visitor and coop access grants
    temporary-access = true

    # Durable offline reward inbox
    rewards = true

    # Public warps and safe teleport engine
    warps = true

    # Shared island vault and paged inventories
    vault = true

    # Island private team chat with channel routing
    chat = true

    # Leader inactivity monitoring and automated succession
    inactivity = true

    # 4-dimensional administrative quarantine and freeze subsystem
    admin-freeze = true

    # Island missions, quest trees, and milestone progression (Section 2.12)
    missions = true

    # Island boundaries, spillover physics shield, and virtual world border (Section 2.13)
    boundary = true
}

# Explicit Capability Provider Selection
# When multiple modules provide the same capability (e.g. built-in bank vs external economy provider),
# the active provider MUST be explicitly declared here to eliminate collision ambiguity.
capabilities {
    "island-bank" {
        selected-provider = "bank"
    }
}
