# ==============================================================================
# UXPLIMA Skyblock - Social Discovery, Ratings & Guestbook (HOCON)
# ==============================================================================

social {
  # Minimum dwell time spent visiting an island before being eligible to rate
  min-dwell-time = "30s"

  # Bayesian rating aggregation weighting parameters
  prior-weight = 5
  prior-mean = 3.0

  # Maximum number of pinned reviews allowed per guestbook
  max-pinned = 3

  # Maximum character length for guestbook entries
  max-message-length = 256
}
