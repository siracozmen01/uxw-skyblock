# ==============================================================================
# UXPLIMA Skyblock - Multi-Dimension Architecture & Portal Linkage (Sections 2.27 & 2.37)
# ==============================================================================

dimensions {
    # Whether the multi-dimension subsystem is enabled.
    enabled = true

    # Nether dimension configuration
    nether {
        # Mode: PRIVATE_ISLAND (1-to-1 coordinate mirror), SHARED_WORLD (centralized wilderness), or DISABLED
        mode = "PRIVATE_ISLAND"

        # Destination world name
        world-name = "skyblock_nether"

        # Upgrade required in upgrades.conf to unlock portal access (or empty for unrestricted)
        required-upgrade = "island_nether"

        # Schematic key for the starter dimension outpost/platform
        schematic = "island_nether"
    }

    # The End dimension configuration
    end {
        # Mode: PRIVATE_ISLAND (1-to-1 coordinate mirror), SHARED_WORLD (centralized wilderness), or DISABLED
        mode = "PRIVATE_ISLAND"

        # Destination world name
        world-name = "skyblock_the_end"

        # Upgrade required in upgrades.conf to unlock portal access (or empty for unrestricted)
        required-upgrade = "island_end"

        # Schematic key for the starter dimension platform
        schematic = "island_end"
    }
}
