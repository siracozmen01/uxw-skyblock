# ==============================================================================
# UXPLIMA Skyblock - Command names
#
# Every word of the island command is yours. Change a name, add aliases, or turn
# a word off. The key in front of each block is the word the plugin ships; the
# name inside it is the word players type.
#
#   name     the word players type
#   aliases  more words that do the same
#   enabled  false leaves the word out of the command entirely
#
# A name another branch already answers to is refused with a warning in the
# console, and that branch keeps its own word. A change needs a restart.
# ==============================================================================

commands {
  island {
    name = "island"
    aliases = ["is"]
    enabled = true

