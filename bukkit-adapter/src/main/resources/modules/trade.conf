# Trading between players. Two players on this server open one window, each puts in what they offer
# from their own inventory, and the trade happens when both agree. What is offered stays in its owner's
# inventory until then, so nothing is lost when a trade is called off or the server stops.

# Whether players can trade.
enabled = true

# How long a request to trade waits for an answer, in seconds. From 5 to 600.
request-seconds = 60

# How far apart two players may be to trade, in blocks. Below zero for anywhere on this server.
max-distance = -1

# What the trade window is drawn with. Each is a material name.
window {
    # The column between the two offers.
    divider = "BLACK_STAINED_GLASS_PANE"
    # The button a player presses when they agree, and the same button while they do not.
    ready = "LIME_CONCRETE"
    waiting = "RED_CONCRETE"
    # What shows whether the other player agrees.
    other-ready = "LIME_STAINED_GLASS_PANE"
    other-waiting = "RED_STAINED_GLASS_PANE"
    # The button that ends the trade.
    cancel = "BARRIER"
}
