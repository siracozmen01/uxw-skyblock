# OneBlock: an island that starts as one block. Break it and it comes back as something else, drawn
# from the phase the island has reached. Each phase lasts a number of breaks, counted over the whole
# life of the island.
#
# The phases are a list, and an island goes through them in the order they are written.
#
# A block or creature name is the server's own, such as "IRON_ORE" or "cow". A name the server does
# not know is left out with a warning in the console. A phase's name is also the key its title is
# read by in the language files, under oneblock.phases.

# Whether islands can be made as OneBlock islands.
enabled = true

# What an island does after its last phase: "stay" keeps it in the last phase, "repeat" starts again
# from the first.
after-last-phase = "repeat"

phases = [
    {
        name = "plains"
        # How many breaks this phase lasts.
        length = 400
        # What the block turns into. A weight of 4 comes up four times as often as a weight of 1.
        blocks {
            GRASS_BLOCK = 20
            DIRT = 12
            OAK_LOG = 8
            BIRCH_LOG = 4
            MELON = 1
            PUMPKIN = 1
        }
        # How likely one break is to bring a creature onto the block, from 0 to 1.
        creature-chance = 0.05
        creatures {
            cow = 3
            sheep = 3
            chicken = 2
            pig = 2
        }
    }
    {
        name = "underground"
        length = 600
        blocks {
