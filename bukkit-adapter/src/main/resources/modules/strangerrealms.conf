# StrangerRealms: an island of real land, with an Upside Down in place of the Nether. The Upside Down
# is the island's land mirrored block for block and distressed: the grass dead, the trees bare, the
# flowers withered. It is laid when the island is made, in the world dimensions.conf names for the
# Nether, so the Nether of a StrangerRealms island is its Upside Down.

# Whether islands can be made as StrangerRealms islands.
enabled = true

upside-down {
    # How far from the island's centre the land is mirrored, in blocks. Every chunk it reaches is
    # copied whole, from the lowest height both worlds share to the highest.
    radius = 48
    # How the mirror distresses what it copies. Each rule is FROM:TO: a block, or a name with one *
    # such as *_LEAVES, turned into another block. The first rule that matches wins, and a block no
    # rule matches is mirrored as it is.
    palette = [
        "GRASS_BLOCK:MYCELIUM",
        "DIRT:COARSE_DIRT",
        "DIRT_PATH:COARSE_DIRT",
        "SHORT_GRASS:DEAD_BUSH",
        "FERN:DEAD_BUSH",
        "TALL_GRASS:AIR",
        "LARGE_FERN:AIR",
        "*_LEAVES:AIR",
        "*_LOG:STRIPPED_DARK_OAK_LOG",
        "*_WOOD:STRIPPED_DARK_OAK_WOOD",
        "POPPY:WITHER_ROSE",
        "DANDELION:WITHER_ROSE",
        "SAND:SOUL_SAND"
    ]
}

# What the Upside Down makes of a creature born in it, on a StrangerRealms island's land. The Upside
# Down is the Nether's world, so what would be born there is Nether-born: here it is turned into the
# creature of the overworld it has become.
mobs {
    # The ways of being born that are turned: NATURAL, CHUNK_GEN, SPAWNER, and any other the server
    # names. A creature a command or a plugin brings is left alone.
    reasons = ["NATURAL", "CHUNK_GEN", "SPAWNER"]
    # Each rule is FROM:TO: a creature, or a name with one * such as *_PIGLIN, turned into another.
    # TO may be NONE, which keeps the creature from being born at all. The first rule that matches
    # wins, and a creature no rule matches is born as it is.
    turn = [
        "PIGLIN:ZOMBIE",
        "PIGLIN_BRUTE:VINDICATOR",
        "ZOMBIFIED_PIGLIN:HUSK",
        "HOGLIN:ZOGLIN",
        "MAGMA_CUBE:SLIME",
        "GHAST:PHANTOM",
        "WITHER_SKELETON:STRAY",
        "BLAZE:VEX",
        "STRIDER:NONE"
    ]
    # What every creature born there carries, each written name:amplifier:seconds.
    effects = ["speed:0:3600", "resistance:0:3600"]
}

# The glimmer: a light set on a StrangerRealms island's land shines through at the same place in the
# Upside Down, and one set in the Upside Down shines through on the land, for as long as it stands.
# The glimmer is light without a block, so nothing can be taken or built on it.
glimmer {
    # Whether lights glimmer across at all.
    enabled = true
    # The blocks that are lights: a name, or a name with one * such as *_CANDLE.
    lights = [
        "TORCH",
        "WALL_TORCH",
        "SOUL_TORCH",
        "SOUL_WALL_TORCH",
        "LANTERN",
        "SOUL_LANTERN",
        "GLOWSTONE",
        "SEA_LANTERN",
        "SHROOMLIGHT",
        "JACK_O_LANTERN",
        "*_CANDLE",
        "CANDLE",
        "REDSTONE_LAMP"
    ]
    # How bright the glimmer is, from 1 to 15.
    level = 12
}
