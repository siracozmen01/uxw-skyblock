# ==============================================================================
# UXPLIMA Skyblock - Web map
# ==============================================================================
#
# What Dynmap, BlueMap and Pl3xMap show of the islands. A web map is one page every visitor
# reads, so write its words in the language your players read.

webmap {
    # The name of the layer the islands are drawn on.
    layer = "Islands"

    # The colours of an island's area. The ten highest ranked islands are drawn as top, the
    # islands of an alliance as allied, and every other island as other. Opacity runs from 0,
    # clear, to 1, solid. Weight is the width of the border line.
    top { border = "#FFE66D", fill = "#FFE66D", opacity = 0.35, weight = 3 }
    allied { border = "#4ECCA3", fill = "#4ECCA3", opacity = 0.25, weight = 2 }
    other { border = "#48CAE4", fill = "#48CAE4", opacity = 0.15, weight = 1 }

    # The words of a marker. name is the label of an island that has no name of its own, and
    # <island> in it is the first eight letters of the island's id.
    words {
        name = "Island <island>"
        owner = "Owner"
        level = "Level"
        rank = "Rank"
        unranked = "Unranked"
        worth = "Net worth"
        bank = "Bank"
    }
}
