# ==============================================================================
# UXPLIMA Skyblock - Island Biome Unlocks
#
# Which biomes an island may take, and what it has to reach first. These numbers
# used to live in the code, so a server that wanted the end sooner had nowhere
# to say so.
#
# required-level is the island level the biome asks for. Zero means anyone.
# offered = false takes the biome off this server entirely, whatever the level.
#
# A node with no level engine has no levels to require, so every offered biome
# is open there. The biome menu is menus/island-biome.conf and it is yours to
# rewrite: taking a biome off here does not remove its button, it refuses it.
# ==============================================================================

biomes {
    # Whether islands may change their biome on this server at all.
    enabled = true

    unlocks {
        plains {
            required-level = 0
            offered = true
        }
        desert {
            required-level = 5
            offered = true
        }
        nether_wastes {
            required-level = 10
            offered = true
        }
        jungle {
            required-level = 15
            offered = true
        }
        snowy_plains {
            required-level = 20
            offered = true
        }
        flower_forest {
            required-level = 25
            offered = true
        }
        swamp {
            required-level = 30
            offered = true
        }
        the_end {
            required-level = 50
            offered = true
        }
    }
}
