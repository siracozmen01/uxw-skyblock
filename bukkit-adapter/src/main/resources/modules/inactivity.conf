inactivity {
    # Whether automated inactivity scanning and succession lifecycle is enabled
    enabled = true

    # Interval in seconds between automated inactivity scans (e.g. 86400 = 24 hours)
    check-interval-seconds = 86400

    # How long an island owner can be absent before automated succession is triggered
    owner-inactivity-duration = "30d"

    # How long ALL island members can be absent before total abandonment action is executed
    all-members-inactivity-duration = "60d"

    # Priority order of eligible member roles for leadership succession
    succession-hierarchy = ["CO_OWNER", "MODERATOR", "MEMBER"]

    # Action applied to the deposed leader (DEMOTE_TO_CO_OWNER, DEMOTE_TO_MEMBER, KICK_FROM_ISLAND)
    former-owner-action = "DEMOTE_TO_CO_OWNER"

    # Action applied when an island is completely abandoned (ARCHIVE, DELETE_AND_RECYCLE)
    abandonment-action = "ARCHIVE"
}
