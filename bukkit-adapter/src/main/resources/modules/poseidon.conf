# Poseidon: an island on the sea floor. Water is the air a Poseidon player breathes: in it they see and
# breathe, out of it dry air and the sun burn them, and one who stops moving in the water drowns. The
# Nether of a Poseidon island is flooded.

# Whether islands can be made as Poseidon islands.
enabled = true

# The ocean an island lies at the bottom of. It fills the air around the island and never replaces a
# block the island already has.
ocean {
    # How many blocks of water stand over the block players arrive on.
    above = 24
    # How many blocks of water lie under it, down to the floor.
    depth = 8
    # How far from the island's centre the ocean reaches. Keep it inside half the grid spacing, so two
    # islands' oceans never meet.
    radius = 64
    # The block the ocean stands on. A block that falls, such as sand or gravel, would drop out from
    # under the ocean and let it drain away, so one of those is replaced by sandstone.
    floor = "SANDSTONE"
}

# How the air hurts a player on a Poseidon island. Water is their air: in it nothing hurts, unless they
# stay in one spot too long. A player in creative or spectator is never touched.
hazard {
    # How often each player on a Poseidon island is checked.
    check-every = "1s"
    # Health taken at each check from a player out of the water. A heart is 2.
    dry-damage = 1.0
    # Health the sun adds at each check, on a player out of the water under an open daytime sky.
    sun-damage = 2.0
    # Health taken at each check from a swimmer who has stayed still too long.
    still-damage = 2.0
    # How long a swimmer may stay still before the water hurts.
    still-after = "5s"
    # How far a swimmer must move, in blocks, to count as moving.
    still-reach = 1.0
    # Whether rain keeps a player out of the water from drying.
    rain-is-wet = true
    # Effects the water gives, each written name:amplifier:seconds. Keep each longer than check-every,
    # or it runs out between two checks.
    water-effects = ["water_breathing:0:4", "night_vision:0:15"]
}
