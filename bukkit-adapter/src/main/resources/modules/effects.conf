# ==============================================================================
# UXPLIMA Skyblock - What every interaction fires
#
# An interaction is a name here and a list of effect lines under it. They happen
# in the order they are written. An interaction this file does not name fires
# nothing, and so does one written as an empty list: the first is a server that
# never asked for it, the second is one that turned it off, and both are quiet.
#
# The shape is one word, a colon, and whatever that word takes:
#
#   message:<catalogue key>
#   title:<catalogue key>
#   subtitle:<catalogue key>
#   actionbar:<catalogue key>
#   bossbar:<catalogue key> <colour> <seconds>
#   sound:<sound name> <volume> <pitch>
#   particle:<particle name> <count> <spreadX> <spreadY> <spreadZ> <speed>
#
# Every word a player reads is a catalogue key from messages/, never the
# sentence itself, so a line written here is written in as many languages as
# there are files.
#
# A line this server cannot make sense of, a sound this version does not have
# or a particle that was renamed, is skipped. The rest of the list still
# happens, and the thing the interaction was about always happens.
# ==============================================================================

effects {
    # A player arrives somewhere and hostile mobs around them are pushed back.
    kinetic-ward = [
        "sound:ENTITY_PLAYER_ATTACK_SWEEP 1.0 1.2",
        "particle:CRIT 20 0.8 0.2 0.8 0.1"
    ]

    # Lava a player poured is turned to obsidian rather than left to run.
    obsidian-recovery = [
        "sound:ITEM_BUCKET_FILL_LAVA 1.0 1.0",
        "particle:CAMPFIRE_COSY_SMOKE 6 0.2 0.2 0.2 0.02"
    ]

    # A block a player placed is refused because the island is at one of its limits.
    limit-refused = [
        "sound:BLOCK_NOTE_BLOCK_BASS 1.0 0.5"
    ]

    # A mission is finished.
    mission-completed = [
        "sound:UI_TOAST_CHALLENGE_COMPLETE 1.0 1.0"
    ]
}
