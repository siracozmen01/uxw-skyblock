# ==============================================================================
# UXPLIMA Skyblock - Island Alliances & Diplomatic Relations Configuration
# ==============================================================================

alliances {
    # Whether the alliances subsystem is enabled.
    enabled = true

    # Default maximum number of allied islands per island aggregate.
    # Can be dynamically scaled per island via island upgrade tiers.
    max-allies = 2

    # Duration before an unaccepted alliance invitation expires.
    invite-timeout = "5m"

    # Prevent accidental PvP damage between members of allied islands.
    friendly-fire-shielding = true

    # Allow allied players to visit an island even when it is locked to general visitors.
    privileged-visit-access = true

    # Enable private cross-alliance chat channel (/is ac <message> or /is allychat).
    alliance-chat-enabled = true
}
