# ==============================================================================
# UXPLIMA Skyblock - Flexible Island Boosters & Multipliers Configuration (HOCON)
# Canonical Section 2.34: Schema-driven categories, stacking strategies,
# decay policies, and pause-on-idle semantics.
# ==============================================================================
boosters {
    # Dynamically freeze booster timers when zero island members are online
    pause-when-empty = true

    # Interval for scheduled background purging of expired unpaused boosters
    clean-interval = "60s"

    # How long a booster multiplier stays good enough to use without asking the database again.
    # A mob death has to know the multiplier before the event returns, so it reads this cache
    # instead of the database and refreshes it on a background thread. Lower means a booster takes
    # effect sooner after it is bought; higher means fewer queries under a mob farm.
    multiplier-cache-ttl = "5s"

    # Category-specific configurations
    categories {
        spawner_rate {
            enabled = true
            stack-mode = "DURATION"
            duration-policy = "INDEPENDENT"
            calculation = "ADDITIVE"
            max-multiplier = 5.0
            max-duration = "7d"
            default-multiplier = 1.5
            default-duration = "1h"
        }

        crop_growth {
            enabled = true
            stack-mode = "DURATION"
            duration-policy = "INDEPENDENT"
            calculation = "ADDITIVE"
            max-multiplier = 5.0
            max-duration = "7d"
            default-multiplier = 1.5
            default-duration = "1h"
        }

        ore_generator {
            enabled = true
            stack-mode = "DURATION"
            duration-policy = "INDEPENDENT"
            calculation = "ADDITIVE"
            max-multiplier = 5.0
            max-duration = "7d"
            default-multiplier = 1.5
            default-duration = "1h"
        }

        mob_exp {
            enabled = true
            stack-mode = "MULTIPLIER"
            duration-policy = "INDEPENDENT"
            calculation = "ADDITIVE"
            max-multiplier = 4.0
            max-duration = "3d"
            default-multiplier = 1.5
            default-duration = "1h"
        }

        island_worth {
            enabled = true
            stack-mode = "DURATION"
            duration-policy = "INDEPENDENT"
            calculation = "ADDITIVE"
            max-multiplier = 3.0
            max-duration = "3d"
            default-multiplier = 1.25
            default-duration = "1h"
        }

        mission_rewards {
            enabled = true
            stack-mode = "MULTIPLIER"
            duration-policy = "REFRESH"
            calculation = "ADDITIVE"
            max-multiplier = 3.0
            max-duration = "3d"
            default-multiplier = 1.5
            default-duration = "1h"
        }
    }
}
