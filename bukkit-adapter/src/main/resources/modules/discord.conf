# ==============================================================================
# UXPLIMA Skyblock - Standalone Discord Webhooks Configuration (HOCON)
# ==============================================================================

discord {
  # Master toggle for outbound Discord notifications
  enabled = false

  # Bot identity settings
  bot-username = "UXPLIMA Skyblock"
  avatar-url = ""

  # Outbound rate limit (requests per second across all webhook topics)
  rate-limit-per-second = 2.0

  # Webhook URLs categorized by notification topic
  # Leave empty ("") to disable notifications for a specific topic
  webhooks {
    milestones = ""
    leaderboards = ""
    alliances = ""
    admin-audit = ""
  }

  # What each embed says. A <name> is replaced with the value the embed carries.
  # A key left out keeps the text shown here. Colours are #RRGGBB.
  embeds {
    # Carries <island>, <leader>, <level>, and <count> in members-field.
    milestone {
      title = "🌟 Island Level Milestone Reached!"
      description = "Island **<island>** has achieved Level **<level>**!"
      leader-field = "Leader"
      level-field = "Island Level"
      members-field = "Members (<count>)"
      footer = "UXPLIMA Skyblock Milestones"
      color = "#FFD700"
    }
    # The title carries <metric>. Each line carries <place>, <island> and <score>.
    # <place> is a medal for the first three and other-place, which carries <rank>, for the rest.
    leaderboard {
      title = "🏆 Top Islands Leaderboard: <metric>"
      line = "<place> **<island>**: <score>"
      first-place = "🥇"
      second-place = "🥈"
      third-place = "🥉"
      other-place = "`#<rank>`"
      empty = "No leaderboard entries recorded."
      footer = "UXPLIMA Skyblock Leaderboard"
      color = "#FFA500"
    }
    # Carries <alliance>, <action>, <actor> and <target>.
    alliance {
      title = "⚔️ Diplomatic Event: <action>"
      description = "Alliance update concerning **<alliance>**."
      alliance-field = "Alliance"
      actor-field = "Initiated By"
      target-field = "Target"
      footer = "UXPLIMA Skyblock Diplomacy"
      color = "#3498DB"
    }
    # The title carries <severity> and <event>. The colour follows the severity.
    audit {
      title = "🛡️ Staff Audit Alert [<severity>]: <event>"
      footer = "UXPLIMA Skyblock Administrative Audit"
      high-color = "#E74C3C"
      medium-color = "#E67E22"
      low-color = "#95A5A6"
    }
  }
}
