# ==============================================================================
# UXPLIMA Skyblock - Public Island Warps & Safe Teleport Configuration (WAR-001)
# ==============================================================================

warps {
    # Whether the island warps subsystem is enabled.
    enabled = true

    # Default base warps allowed per island before upgrades.
    base-warp-limit = 2

    # Safe teleport anti-trap search radius (in blocks) around target coordinate.
    search-radius = 5

    # Teleport warmup delay in seconds (0 to disable warmup for instant teleport).
    warmup-seconds = 3

    # Whether movement during warmup cancels the teleport.
    cancel-on-move = true

    # Cooldown between teleport requests in seconds.
    cooldown-seconds = 5
}
