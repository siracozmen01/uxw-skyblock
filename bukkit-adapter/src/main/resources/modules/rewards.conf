# ==============================================================================
# UXPLIMA Skyblock - Offline Reward Inbox Configuration (RWD-001)
# ==============================================================================

rewards {
    # Whether the offline reward inbox subsystem is enabled.
    enabled = true

    # Default expiration duration for reward grants if not explicitly provided.
    default-expiration = "30d"

    # Periodic interval for scrubbing/expiring stale pending reward grants.
    expiry-check-interval = "5m"

    # Maximum number of pending rewards a player profile may accumulate in inbox.
    max-inbox-capacity = 50

    # Auto-claim pending rewards when player profile logs in.
    auto-claim-on-join = false
}
