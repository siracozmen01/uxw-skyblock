# ==============================================================================
# UXPLIMA Skyblock - Temporary Access Grants Configuration (ACC-001)
# ==============================================================================

temporary-access {
    # Whether the temporary access grants subsystem is enabled.
    enabled = true

    # Default duration for timestamp-based temporary access grants.
    default-duration = "1h"

    # Maximum duration for any temporary access grant.
    max-duration = "24h"

    # Purge interval for scrubbing expired grants from database.
    purge-interval = "1m"

    # Enforce strict Ironman/Stranded isolation forbidding cross-profile trust.
    enforce-ruleset-isolation = true

    # How long a node may answer "who has a grant on this island" from memory.
    # Every block a player who is not a member touches asks that question, so
    # reading it from the database each time is a query per click. A node always
    # knows the grants it made itself; this window is only how long it may take
    # to notice one another node made. Set it to 0 to read every time.
    grant-lookup-ttl = "30s"
}
