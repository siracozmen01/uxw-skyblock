# ==============================================================================
# UXPLIMA Skyblock - Seasons Configuration (HOCON)
# Automated competitive cycles, snapshot archives, and durable payout queuing
# ==============================================================================

seasons {
    # Active season number
    season-number = 1

    # Season display name
    season-name = "Season 1 - Genesis"

    # Default duration for newly bootstrapped seasons (e.g. "30d", "14d", "60m")
    duration = "30d"

    # Background verification interval to detect season expiration and trigger freezes
    check-interval = "60s"

    # Competitive reward actions queued by island level rank placement
    # Both legacy command strings and typed reward structures are supported:
    # SQL_CURRENCY, EXTERNAL_VAULT, ITEM, PERMISSION, COSMETIC
    rewards {
        1 = [
            {
                type = "SQL_CURRENCY"
                currency = "PRIMARY"
                amount = 1000000
            },
            {
                type = "ITEM"
                item = "NETHERITE_INGOT"
                amount = 16
            },
            {
                type = "PERMISSION"
                permission = "uxmskyblock.vip"
            },
            {
                type = "COSMETIC"
                cosmetic-id = "season_1_crown"
            }
        ]
        2 = [
            {
                type = "SQL_CURRENCY"
                currency = "PRIMARY"
                amount = 500000
            },
            {
                type = "ITEM"
                item = "DIAMOND_BLOCK"
                amount = 32
            }
        ]
        3 = [
            {
                type = "SQL_CURRENCY"
                currency = "PRIMARY"
                amount = 250000
            },
            {
