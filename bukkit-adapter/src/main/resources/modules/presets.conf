# ==============================================================================
# UXPLIMA Skyblock - Starter Presets
#
# This file is the list of islands a player may start with. Add a block here and
# the choice appears in /is create and in its suggestions, with no line of Java.
#
# display-name and description are catalogue keys. A key beginning with @ is
# looked up in the language files, so every language answers it in its own
# words. Write a key here, and the sentence in messages_en.conf,
# messages_tr.conf and every other language file you ship.
#
# schematic is a path under the plugin's data folder. biome is one of the
# IslandBiome values, and an unknown one falls back to PLAINS.
#
# mode is the game mode the island plays: "skyblock", "oneblock", "chunkblock",
# "acid_island", "caveblock", "skygrid" or "boxed".
# An unknown one is skyblock.
#
# start lists what builds the island, in order. "uxm:platform" lays the starter
# platform and is what a preset without a start list gets. "uxm:oneblock" sets
# a OneBlock island's single block, and exists while modules/oneblock.conf is
# enabled. "uxm:chunkblock" starts a ChunkBlock island's territory as the one
# chunk its centre stands in, and exists while modules/chunkblock.conf is
# enabled. "uxm:acid-sea" lays the acid sea around an AcidIsland island, and
# exists while modules/acidisland.conf is enabled. "uxm:cavern" encloses a CaveBlock
# island in rock with its cave carved out, and exists while modules/caveblock.conf
# is enabled. "uxm:skygrid" makes the island a sparse grid of blocks, and exists
# while modules/skygrid.conf is enabled. "uxm:boxed" makes the island a Boxed
# island, its box grown by advancements, and exists while modules/boxed.conf is
# enabled. "uxm:ocean" lays the ocean a Poseidon island lies at the bottom of, and
# exists while modules/poseidon.conf is enabled. "uxm:shipwreck", "uxm:ruin" and
# "uxm:ruins" lay the wrecks and ruins modules/poseidon.conf names, each while it
# is enabled. "uxm:upside-down" makes the island a StrangerRealms island and mirrors
# its land into the Upside Down, and exists while modules/strangerrealms.conf is
# enabled. "uxm:course" makes the island a Parkour course with its start plate, and
# exists while modules/parkour.conf is enabled. A preset whose start names an action this
# server does not provide is not offered.
#
# world is the world the preset's islands are made in. Leave it out and they are
# made in the server's island world, the one config.conf names. A mode played on
# land of its own names a world the server makes the usual way. Each such world
# is an island world: its islands are protected, kept alive and scanned there.
#
# dimensions says how the island starts in every other dimension, by dimension
# id: the_nether, the_end, or one a server adds such as myserver:mining_realm.
# Each names its own start list and the height players arrive standing on. A
# preset without a dimensions block lays a platform at height 64 in the Nether
# and the End. One with it builds only in the dimensions it names.
#   dimensions {
#     the_nether { start = ["uxm:dimension-platform"], height = 70 }
#   }
# ==============================================================================

presets {
    # The preset a player who names none gets.
    default = "classic"

    entries {
        classic {
            display-name = "@presets.classic.name"
            description = "@presets.classic.description"
            schematic = "schematics/classic.schem"
            biome = "PLAINS"
        }
        desert {
            display-name = "@presets.desert.name"
            description = "@presets.desert.description"
            schematic = "schematics/desert.schem"
            biome = "DESERT"
        }
        nether {
            display-name = "@presets.nether.name"
            description = "@presets.nether.description"
            schematic = "schematics/nether.schem"
            biome = "NETHER_WASTES"
        }
        cave {
            display-name = "@presets.cave.name"
            description = "@presets.cave.description"
            schematic = "schematics/cave.schem"
            biome = "PLAINS"
        }
        oneblock {
            display-name = "@presets.oneblock.name"
            description = "@presets.oneblock.description"
            schematic = "schematics/oneblock.schem"
            biome = "PLAINS"
            mode = "oneblock"
            start = ["uxm:oneblock"]
        }
        chunkblock {
            display-name = "@presets.chunkblock.name"
            description = "@presets.chunkblock.description"
            schematic = "schematics/chunkblock.schem"
            biome = "PLAINS"
            mode = "chunkblock"
            # The magic block, then the one chunk around it. The chunks beside it open with the level.
            start = ["uxm:oneblock", "uxm:chunkblock"]
            # The Nether and the End stay closed to a ChunkBlock island until a dimension is named here.
            dimensions {
            }
        }
        acid_island {
            display-name = "@presets.acid_island.name"
            description = "@presets.acid_island.description"
            schematic = "schematics/acid_island.schem"
            biome = "PLAINS"
            mode = "acid_island"
            # The starter platform, then the acid sea around it.
            start = ["uxm:platform", "uxm:acid-sea"]
        }
        caveblock {
            display-name = "@presets.caveblock.name"
            description = "@presets.caveblock.description"
            schematic = "schematics/caveblock.schem"
            biome = "PLAINS"
            mode = "caveblock"
            # The starter platform, then the rock around it with the room it stands in carved out.
            start = ["uxm:platform", "uxm:cavern"]
            # In the Nether and the End the island is enclosed in that dimension's own rock.
            dimensions {
                the_nether { start = ["uxm:dimension-platform", "uxm:cavern"], height = 70 }
                the_end { start = ["uxm:dimension-platform", "uxm:cavern"], height = 64 }
            }
        }
        boxed {
            display-name = "@presets.boxed.name"
            description = "@presets.boxed.description"
            schematic = "schematics/boxed.schem"
            biome = "PLAINS"
            mode = "boxed"
            # Generated land, in a world the server makes the usual way. Make a world called boxed, or
            # name the one you have.
            world = "boxed"
            # Nothing is built: the island is the land, inside a box advancements grow.
            start = ["uxm:boxed"]
            # The Nether and the End stay closed to a Boxed island until a dimension is named here.
            dimensions {
            }
        }
        poseidon {
            display-name = "@presets.poseidon.name"
            description = "@presets.poseidon.description"
            schematic = "schematics/poseidon.schem"
            biome = "WARM_OCEAN"
            mode = "poseidon"
            # The starter platform, the ocean over it, then a shipwreck on the sea floor.
            start = ["uxm:platform", "uxm:ocean", "uxm:shipwreck"]
            # The Nether of a Poseidon island is flooded.
            dimensions {
                the_nether { start = ["uxm:dimension-platform", "uxm:ocean"], height = 70 }
                the_end { start = ["uxm:dimension-platform"], height = 64 }
            }
        }
        poseidon_ruin {
            display-name = "@presets.poseidon_ruin.name"
            description = "@presets.poseidon_ruin.description"
            schematic = "schematics/poseidon.schem"
            biome = "WARM_OCEAN"
            mode = "poseidon"
            # As poseidon, with one big ruin further out.
            start = ["uxm:platform", "uxm:ocean", "uxm:shipwreck", "uxm:ruin"]
            # The Nether of a Poseidon island is flooded.
            dimensions {
                the_nether { start = ["uxm:dimension-platform", "uxm:ocean"], height = 70 }
                the_end { start = ["uxm:dimension-platform"], height = 64 }
            }
        }
        poseidon_ruins {
            display-name = "@presets.poseidon_ruins.name"
            description = "@presets.poseidon_ruins.description"
            schematic = "schematics/poseidon.schem"
            biome = "WARM_OCEAN"
            mode = "poseidon"
            # As poseidon, with a ring of small ruins further out.
            start = ["uxm:platform", "uxm:ocean", "uxm:shipwreck", "uxm:ruins"]
            # The Nether of a Poseidon island is flooded.
            dimensions {
                the_nether { start = ["uxm:dimension-platform", "uxm:ocean"], height = 70 }
                the_end { start = ["uxm:dimension-platform"], height = 64 }
            }
        }
        stranger_realms {
            display-name = "@presets.stranger_realms.name"
            description = "@presets.stranger_realms.description"
            schematic = "schematics/stranger_realms.schem"
            biome = "PLAINS"
            mode = "stranger_realms"
            # A world of real land the server makes the usual way, as for Boxed. Make it, or name
            # the one you have.
            world = "realms"
            # Nothing is built: the island is the land, and its Upside Down is mirrored from it.
            start = ["uxm:upside-down"]
            # The Upside Down takes the place of the Nether. The End is the End.
            dimensions {
                the_nether { start = ["uxm:upside-down"], height = 64 }
                the_end { start = ["uxm:dimension-platform"], height = 64 }
            }
        }
        parkour {
            display-name = "@presets.parkour.name"
            description = "@presets.parkour.description"
            schematic = "schematics/parkour.schem"
            biome = "PLAINS"
            mode = "parkour"
            # The starter platform with the course's start plate at its edge. The team builds on from it.
            start = ["uxm:platform", "uxm:course"]
            # A course has no Nether and no End.
            dimensions {
            }
        }
        skygrid {
            display-name = "@presets.skygrid.name"
            description = "@presets.skygrid.description"
            schematic = "schematics/skygrid.schem"
            biome = "PLAINS"
            mode = "skygrid"
            # A sparse grid of blocks, with players arriving on a safe block at its centre.
            start = ["uxm:skygrid"]
            # The Nether and the End are grids of their own blocks.
            dimensions {
                the_nether { start = ["uxm:skygrid"], height = 70 }
                the_end { start = ["uxm:skygrid"], height = 64 }
            }
        }
    }
}
