# AcidIsland: an island that stands in an acid sea. The sea burns whoever swims in it, and acid rain
# burns whoever it falls on. Water taken from the sea is acid too: a bottle of it poisons the one who
# drinks it until it is made clean. Rain a cauldron catches is clean already, but a cauldron a bucket
# of sea water was poured into holds the sea until it is emptied.

# Whether islands can be made as AcidIsland islands.
enabled = true

# The sea an AcidIsland island is made in. It fills the air around the island and never replaces a
# block the island already has.
sea {
    # How many blocks below the island's start height the surface stands.
    below-island = 2
    # How many blocks of water, above the floor.
    depth = 4
    # How far from the island's centre the sea reaches. Keep it inside half the grid spacing, so two
    # islands' seas never meet.
    radius = 64
    # The block the sea stands on.
    floor = "SAND"
}

hazard {
    # How often each player on an AcidIsland island is checked.
    check-every = "1s"
    # Health taken at each check from a player in the sea. A heart is 2.
    water-damage = 2.0
    # Health taken at each check from a player the rain falls on.
    rain-damage = 1.0
    # Whether anything worn on the head keeps the rain off.
    helmet-blocks-rain = true
    # Effects, by name, that keep a player safe in the sea.
    water-protection = ["water_breathing"]
    # Effects the sea gives, each written name:amplifier:seconds.
    water-effects = ["poison:0:3"]
}

# How a bottle of acid water is made clean.
purification {
    # Smelting it in a furnace. A bucket of water smelted comes out clean too, and poured into a
    # cauldron keeps it clean.
    furnace = true
    # Brewing it with coal in a brewing stand.
    brewing-with-coal = true
}
