# Parkour: an island that is a course. Its team builds the course; anybody runs it. A run starts on a
# plate over the start block, is saved at every checkpoint plate, and ends on a plate over the finish
# block. The best time of every runner on every course is kept.

# Whether islands can be made as Parkour courses.
enabled = true

# What marks a course.
markers {
    # The plate a run starts and ends on.
    plate = "LIGHT_WEIGHTED_PRESSURE_PLATE"
    # The block under a plate that makes it the start.
    start-under = "EMERALD_BLOCK"
    # The block under a plate that makes it the finish.
    finish-under = "GOLD_BLOCK"
    # The plate that is a checkpoint wherever it stands. A runner who falls is put back on the last one.
    checkpoint = "HEAVY_WEIGHTED_PRESSURE_PLATE"
}

runs {
    # How far below the last checkpoint, or the start, a runner may fall before being put back on it.
    fall-depth = 8
    # How long a run may take before it is dropped.
    time-limit = "30m"
}
