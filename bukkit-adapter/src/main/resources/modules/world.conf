# ==============================================================================
# UXPLIMA Skyblock Void-World Optimization & Structure Suppression (Section 2.42)
# Prevents catastrophic server freezes from void-world locate searches.
# ==============================================================================

# How high above the void a new island's spawn sits. This is the height the
# starter schematic is pasted at, so move it with the schematic.
island-spawn-y = 100

suppressed-structures = [
    "minecraft:mansion",
    "minecraft:monument",
    "minecraft:buried_treasure",
    "minecraft:trial_chambers",
    "minecraft:pillager_outpost",
    "minecraft:ancient_city"
]
