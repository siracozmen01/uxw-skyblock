# ==============================================================================
# UXPLIMA Skyblock - Lifecycle Rules
#
# What happens to a player when they leave their island, are kicked from it,
# die, or have it reset. Each rule names an event and the effects it switches
# on or off. A rule may also name the game mode the player's island plays and
# the ruleset of their profile; a rule that names neither holds for everyone.
#
#   event     leave, kick, death or reset
#   mode      skyblock or oneblock (optional)
#   ruleset   classic, ironman, hardcore or stranded (optional)
#
# Effects, each true or false:
#   clear-inventory     empty the inventory, armour and off hand
#   clear-ender-chest   empty the ender chest
#   reset-experience    take every level and point of experience
#   send-to-spawn       send the player to the world's spawn
#   keep-inventory      death only: keep what was carried
#   keep-experience     death only: keep the experience
#
# The rules that match are laid over each other: first those for everyone,
# then those naming a mode, then those naming a ruleset, then those naming
# both. Among rules as specific as each other, the later one wins. An effect
# no rule switches on does not happen, and a death then is the server's own.
#
# A player who is not on this server when a leave, kick or reset happens is
# owed its effects, and pays them when they next join, on any server.
#
# A reset also empties the inventory when modules/anti_abuse.conf says so,
# whatever these rules say. That purge guards the starter economy.
#
# Examples:
#   { event = "kick", send-to-spawn = true, clear-ender-chest = true }
#   { event = "death", mode = "oneblock", keep-inventory = true }
#   { event = "death", ruleset = "hardcore", clear-ender-chest = true }
# ==============================================================================

