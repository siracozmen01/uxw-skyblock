# ==============================================================================
# UXPLIMA Skyblock - Island Private Chat Subsystem Configuration (CHT-001)
# ==============================================================================

chat {
    # Whether the island chat subsystem is enabled.
    enabled = true

    # The line an island chat message is drawn in. Write a role of theme.conf, such as <muted> or
    # <value>, rather than a colour, and <tag:'Word'> for the category in front.
    # Placeholders: <role>, <player>, <message>
    format = "<tag:'Island'> <muted>[<role>] <value><player><muted>: <body><message>"

    # The same for a message to the island's alliance.
    alliance-format = "<tag:'Alliance'> <muted>[<role>] <value><player><muted>: <body><message>"

    # The line a member of staff spying on island chat reads.
    # Placeholders: <role>, <player>, <message>, <island_name>
    spy-format = "<tag:'Spy'> <muted>[<accent><island_name><muted>] [<role>] <value><player><muted>: <body><message>"

    # Maximum messages allowed per second per player before rate limiting kicks in (0 to disable).
    rate-limit-messages-per-second = 5
}
