# ==============================================================================
# UXPLIMA Skyblock - Shared Island Vault & Paged Inventory Configuration (VLT-001)
# ==============================================================================

vault {
    # Whether the island vault subsystem is enabled.
    enabled = true

    # Default base vault pages unlocked per island before upgrades.
    base-pages = 1

    # Maximum vault pages ceiling an island can unlock through upgrades.
    max-pages = 10

    # How many slots a vault page holds, a multiple of 9 from 9 to 54. The page is drawn by
    # menus/island-vault-page.conf, whose "skyblock:vault-page" region must hold as many slots;
    # until it does, the vault opens in a plain chest of this size. A page that held more slots
    # keeps the items past them and shows them again when this is raised.
    slots-per-page = 45

    # Pessimistic lease duration in seconds for exclusive edit sessions.
    lease-duration-seconds = 60

    # Rolling audit log entries retained per page for security tracking.
    audit-log-limit = 50

    # How often the sessions whose lease ran out are closed and their page unlocked.
    # A player who crashes mid edit leaves one behind, and nothing else closes it.
    expired-session-sweep-interval = "5m"
}
