# ChunkBlock: an island that starts as the one chunk its magic block stands in. The block comes back
# as something else each time it is broken, the way a OneBlock island's does, and draws from the
# phases in modules/oneblock.conf. The island opens the chunks beside it as its level rises.
#
# The level is held, not spent. An island keeps a chunk while its level stays at or above what that
# chunk needed. When the level falls, the newest chunks close first, and players standing in one are
# moved to the island's spawn. Nothing built in a closed chunk is removed; it waits there.
#
# A chunk opens only beside the chunks already open, never across a corner, and never past the
# island's edge.

# Whether islands can be made as ChunkBlock islands.
enabled = true

# The island level the first chunks beyond the starting one need, one by one.
unlock-levels = [1, 3, 6, 10, 15]

# How many more levels each chunk after the list needs than the one before it.
then-every = 5

# A permission node whose holder walks and builds in closed chunks, such as staff helping a player.
# Empty lets nobody through.
bypass-permission = ""
