# English messages.
#
# Every line is MiniMessage, and every line names a role instead of a colour: <body> is the
# text, <value> is a name or a number, <money> is an amount of money, <good> and <bad> are a
# state, and <tag:'ISLAND'> is the prefix a chat line opens with. The colours behind those names
# live in theme.conf, so this file never holds one.
#
# Write ordinary words here. English is drawn in small capitals when a line is shown, so this
# file stays readable for a translator. <plain> keeps a command or an id in ordinary letters.
#
# A key you delete falls back to the line built into the plugin, so a player never reads an
# empty line. Copy this file to messages_<tag>.conf and translate it to add a language.

