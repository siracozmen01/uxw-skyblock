# Build environment. UTF-8 + en-US locale for consistent formatting and compilation
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US -Xmx2G

# Parallel + build caching for fast multi-module builds
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
